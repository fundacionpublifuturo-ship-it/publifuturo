<style>
/* ============================================================================
   [S01] TOKENS DE DISEÑO
   ============================================================================ */
:root{
  --brand-50:#EBF1FF; --brand-100:#D6E2FF; --brand-300:#7FA3F5; --brand-500:#1A57E0; --brand-600:#003EC8; --brand-700:#002885;
  --ink-900:#00012E; --ink-700:#141A3D; --ink-500:#4A5375; --ink-300:#98A0BC;
  --surface:#FFFFFF; --canvas:#F5F7FC; --border:#E3E8F4; --text:#14172B; --muted:#4A5375;
  --violet:#5B4BE1; --violet-50:#EFEDFD; --cyan:#19C1D6; --cyan-50:#E6F9FC;
  --success:#10B981; --success-50:#E7F8F1; --warning:#F59E0B; --warning-50:#FEF4E3; --danger:#EF4444; --danger-50:#FDECEC; --info:#3B82F6; --info-50:#EAF2FE;
  --grad-hero:linear-gradient(135deg,#00012E 0%,#002885 55%,#003EC8 100%);
  --grad-card:linear-gradient(160deg,#FFFFFF 0%,#F2F6FF 100%);
  --r-sm:8px; --r-md:14px; --r-lg:20px; --r-xl:28px; --r-pill:999px;
  --e1:0 1px 2px rgba(0,1,46,.06); --e2:0 6px 20px rgba(0,1,46,.08); --e3:0 18px 48px rgba(0,1,46,.12);
  --font-display:'Outfit',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
html[data-theme="dark"]{
  --surface:#141A3D; --canvas:#0A0E24; --border:#242B52; --text:#E8ECF8; --muted:#A9B1CF; --ink-500:#A9B1CF; --ink-300:#6B7399;
  --brand-600:#4C7BF5; --brand-700:#3562D9; --brand-50:#16204A; --brand-100:#1D2A5E;
  --violet-50:#221F4E; --cyan-50:#0F2E36; --success-50:#0E2F27; --warning-50:#362A10; --danger-50:#3A1717; --info-50:#13254A;
  --grad-card:linear-gradient(160deg,#171E45 0%,#121838 100%);
  --e1:0 1px 2px rgba(0,0,0,.3); --e2:0 6px 20px rgba(0,0,0,.35); --e3:0 18px 48px rgba(0,0,0,.45);
}

/* ============================================================================
   [S02] BASE + COMPONENTES
   ============================================================================ */
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font-body);font-size:15px;line-height:1.55;color:var(--text);background:var(--canvas);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;line-height:1.15;margin:0 0 .5em;letter-spacing:-.02em;color:var(--text)}
h1{font-size:40px}h2{font-size:32px}h3{font-size:22px}h4{font-size:18px}
p{margin:0 0 1em}a{color:var(--brand-600);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
img,svg{display:block;max-width:100%}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:13px}.caption{font-size:12px;color:var(--muted)}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
:focus-visible{outline:2px solid var(--brand-600);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:var(--r-pill);border:1.5px solid transparent;font-weight:600;font-size:14px;cursor:pointer;transition:transform .18s var(--ease),box-shadow .18s,background .18s,color .18s;white-space:nowrap;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--brand-600);color:#fff;box-shadow:0 6px 16px rgba(0,62,200,.25)}.btn-primary:hover{background:var(--brand-700)}
.btn-ghost{background:transparent;border-color:rgba(255,255,255,.4);color:#fff}.btn-ghost:hover{background:rgba(255,255,255,.1)}
.btn-secondary{background:var(--surface);border-color:var(--border);color:var(--text)}.btn-secondary:hover{border-color:var(--brand-300);color:var(--brand-600)}
.btn-soft{background:var(--brand-50);color:var(--brand-600)}.btn-soft:hover{background:var(--brand-100)}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{min-height:34px;padding:0 14px;font-size:13px}.btn-xs{min-height:28px;padding:0 10px;font-size:12px}
.btn-wa{background:#25D366;color:#fff}.btn-wa:hover{background:#1DB954}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);position:relative}
.icon-btn:hover{color:var(--brand-600);border-color:var(--brand-300)}
.icon-btn .dot{position:absolute;top:6px;right:6px;width:16px;height:16px;border-radius:50%;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}

/* Tarjetas */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;box-shadow:var(--e1)}
.card.lift{transition:transform .18s var(--ease),box-shadow .18s}.card.lift:hover{transform:translateY(-4px);box-shadow:var(--e3)}
.card-hd{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.card-hd h3,.card-hd h4{margin:0}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--e1);position:relative;overflow:hidden}
.stat .lbl{font-size:13px;color:var(--muted);margin-bottom:6px}
.stat .val{font-family:var(--font-display);font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.stat .delta{font-size:12px;font-weight:600;margin-top:6px;display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:var(--r-pill)}
.delta.up{background:var(--success-50);color:var(--success)}.delta.down{background:var(--danger-50);color:var(--danger)}.delta.flat{background:var(--brand-50);color:var(--brand-600)}
.stat .spark{position:absolute;right:14px;top:14px;width:80px;height:34px;opacity:.9}
.stat .val{padding-right:88px}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:var(--r-pill);font-size:12px;font-weight:600;line-height:1.4;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.b-ok{background:var(--success-50);color:var(--success)}.b-warn{background:var(--warning-50);color:#B45309}.b-bad{background:var(--danger-50);color:var(--danger)}
.b-info{background:var(--info-50);color:var(--info)}.b-brand{background:var(--brand-50);color:var(--brand-600)}.b-neutral{background:var(--canvas);color:var(--muted);border:1px solid var(--border)}
.b-violet{background:var(--violet-50);color:var(--violet)}.b-cyan{background:var(--cyan-50);color:#0E8FA0}
.pill{display:inline-flex;padding:4px 12px;border-radius:var(--r-pill);background:var(--brand-50);color:var(--brand-600);font-size:12px;font-weight:600}

/* Formularios */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--text)}
.input,.select,.textarea{width:100%;min-height:44px;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--r-md);background:var(--surface);color:var(--text);transition:border-color .15s,box-shadow .15s}
.textarea{min-height:110px;resize:vertical}
.input:focus,.select:focus,.textarea:focus{border-color:var(--brand-600);box-shadow:0 0 0 3px var(--brand-100);outline:none}
.input.err{border-color:var(--danger)}
.help{font-size:12px;color:var(--muted)}.help.err{color:var(--danger)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--brand-600)}
.switch{position:relative;width:44px;height:24px;border-radius:12px;background:var(--border);cursor:pointer;transition:background .2s;border:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s var(--ease);box-shadow:var(--e1)}
.switch.on{background:var(--brand-600)}.switch.on::after{transform:translateX(20px)}

/* Tablas */
.tbl-wrap{overflow:auto;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--e1)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
.tbl th{position:sticky;top:0;text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:12px 14px;background:var(--surface);border-bottom:1px solid var(--border);white-space:nowrap;z-index:1}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover td{background:var(--brand-50)}
.tbl td.money,.tbl th.money{text-align:right;font-variant-numeric:tabular-nums}
.tbl .clip{max-width:220px;overflow:hidden;text-overflow:ellipsis}
.tbl tr.sel td{background:var(--brand-50)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .input,.toolbar .select{min-height:40px;width:auto;min-width:160px}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;padding:10px 14px;font-size:13px;color:var(--muted)}
.pager button{min-width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;color:var(--text)}
.pager button.on{background:var(--brand-600);color:#fff;border-color:var(--brand-600)}

/* Progreso */
.bar{height:8px;border-radius:99px;background:var(--border);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--brand-600);transition:width .6s var(--ease)}
.bar.ok i{background:var(--success)}.bar.warn i{background:var(--warning)}.bar.bad i{background:var(--danger)}.bar.violet i{background:var(--violet)}
.ring{position:relative;width:64px;height:64px}
.ring svg{transform:rotate(-90deg)}.ring .c{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;font-family:var(--font-display)}

/* Avatar */
.av{width:36px;height:36px;border-radius:50%;background:var(--brand-100);color:var(--brand-700);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none;font-family:var(--font-display)}
.av.lg{width:56px;height:56px;font-size:18px}.av.sm{width:28px;height:28px;font-size:11px}
.av.v{background:var(--violet-50);color:var(--violet)}.av.c{background:var(--cyan-50);color:#0E8FA0}.av.g{background:var(--success-50);color:var(--success)}.av.w{background:var(--warning-50);color:#B45309}

/* Estados vacíos y skeleton */
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .ic{width:64px;height:64px;border-radius:20px;background:var(--brand-50);color:var(--brand-600);display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px}
.empty h4{margin-bottom:6px;color:var(--text)}
.sk{background:linear-gradient(90deg,var(--border) 25%,var(--canvas) 50%,var(--border) 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:10px;min-height:16px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Tabs / acordeón */
.tabs{display:flex;gap:4px;background:var(--canvas);padding:4px;border-radius:var(--r-pill);width:max-content;max-width:100%;overflow:auto;border:1px solid var(--border)}
.tabs button{border:none;background:transparent;padding:8px 16px;border-radius:var(--r-pill);font-weight:600;font-size:13px;cursor:pointer;color:var(--muted);white-space:nowrap;min-height:36px}
.tabs button.on{background:var(--surface);color:var(--brand-600);box-shadow:var(--e1)}
.acc{border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);margin-bottom:10px;overflow:hidden}
.acc summary{list-style:none;cursor:pointer;padding:16px 18px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:12px}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";font-size:20px;color:var(--brand-600);transition:transform .2s;font-weight:400}
.acc[open] summary::after{transform:rotate(45deg)}
.acc .body{padding:0 18px 18px;color:var(--muted);font-size:14px}

/* Kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:14px;overflow-x:auto;padding-bottom:12px}
.kcol{background:var(--canvas);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px;min-height:300px}
.kcol.over{border-color:var(--brand-600);background:var(--brand-50)}
.kcol h4{font-size:13px;display:flex;justify-content:space-between;color:var(--muted);margin-bottom:10px}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:12px;margin-bottom:10px;cursor:grab;box-shadow:var(--e1);transition:transform .15s,box-shadow .15s}
.kcard:hover{box-shadow:var(--e2);transform:translateY(-2px)}
.kcard.drag{opacity:.6;transform:rotate(3deg)}
.kcard .t{font-weight:600;font-size:14px;margin-bottom:4px}.kcard .m{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
/* Pipeline compacto con colores de categoría */
.kanban.compact{grid-auto-columns:minmax(220px,1fr);gap:10px}
.kanban.compact .kcol{padding:8px;min-height:200px}
.kanban.compact .kcol h4{font-size:12px;margin-bottom:8px}
.kcol-body{max-height:none}
.kcard.mini{padding:8px 10px;margin-bottom:7px;border-radius:10px}
.kcard.mini .t{font-size:12.5px;font-weight:600;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.kcard.mini .m{font-size:10.5px;gap:5px;align-items:center}
.cat-chip{display:inline-flex;align-items:center;font-size:9.5px;font-weight:800;letter-spacing:.03em;padding:2px 6px;border-radius:6px;line-height:1.3;flex:none}
.cat-legend{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.cat-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:4px 9px;border-radius:99px;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer}
.cat-pill i{width:9px;height:9px;border-radius:50%;flex:none}
.cat-pill.on{border-color:var(--cc);color:var(--text);background:color-mix(in srgb,var(--cc) 12%,transparent)}
.cat-pill:hover{border-color:var(--cc)}

/* Modal / drawer / toast */
.overlay{position:fixed;inset:0;background:rgba(0,1,46,.45);backdrop-filter:blur(4px);z-index:90;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .2s}
.modal{background:var(--surface);border-radius:var(--r-xl);width:min(640px,100%);max-height:90vh;overflow:auto;box-shadow:var(--e3);animation:pop .25s var(--ease)}
.modal .mh{padding:20px 24px 0;display:flex;justify-content:space-between;align-items:center}
.modal .mb{padding:16px 24px 24px}
.modal .mf{padding:0 24px 24px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:91;box-shadow:var(--e3);overflow:auto;animation:slideL .28s var(--ease);padding:24px}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surface);z-index:91;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + var(--sab));max-height:85vh;overflow:auto;animation:slideU .28s var(--ease)}
.toasts{position:fixed;right:20px;bottom:calc(20px + var(--sab));z-index:100;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{background:var(--ink-900);color:#fff;padding:12px 16px;border-radius:14px;box-shadow:var(--e3);font-size:14px;display:flex;gap:10px;align-items:center;animation:slideL .3s var(--ease);pointer-events:auto;max-width:360px}
.toast.ok{border-left:4px solid var(--success)}.toast.err{border-left:4px solid var(--danger)}.toast.info{border-left:4px solid var(--brand-300)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes slideU{from{transform:translateY(100%)}to{transform:none}}

/* Paleta de comandos */
.cmdk{position:fixed;inset:0;z-index:95;background:rgba(0,1,46,.5);backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px}
.cmdk .box{width:min(620px,100%);background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--e3);overflow:hidden;animation:pop .2s var(--ease)}
.cmdk input{width:100%;border:none;padding:18px 20px;font-size:16px;background:transparent;outline:none;border-bottom:1px solid var(--border)}
.cmdk .res{max-height:50vh;overflow:auto;padding:8px}
.cmdk .grp{font-size:11px;font-weight:600;color:var(--muted);padding:8px 12px 4px}
.cmdk .it{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14px}
.cmdk .it:hover,.cmdk .it.on{background:var(--brand-50)}

/* Público — barra superior */
.topbar{position:fixed;top:0;left:0;right:0;z-index:50;transition:background .25s,box-shadow .25s;padding-top:var(--sat)}
.topbar .in{max-width:1280px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.topbar nav{display:flex;gap:4px}
.topbar nav a{padding:8px 14px;border-radius:var(--r-pill);color:rgba(255,255,255,.85);font-weight:500;font-size:14px}
.topbar nav a:hover,.topbar nav a.on{background:rgba(255,255,255,.12);color:#fff}
.topbar.solid{background:var(--surface);box-shadow:var(--e1);backdrop-filter:blur(12px)}
.topbar.solid nav a{color:var(--muted)}.topbar.solid nav a:hover,.topbar.solid nav a.on{background:var(--brand-50);color:var(--brand-600)}
.topbar .acts{display:flex;gap:8px;align-items:center}
.burger{display:none;width:44px;height:44px;border-radius:12px;border:none;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;align-items:center;justify-content:center}
.topbar.solid .burger{background:var(--brand-50);color:var(--brand-600)}
.mnav{position:fixed;inset:0;z-index:80;background:rgba(0,1,46,.5);display:flex;justify-content:flex-end}
.mnav .pane{width:min(320px,88%);background:var(--surface);padding:calc(20px + var(--sat)) 20px calc(20px + var(--sab));display:flex;flex-direction:column;gap:6px;animation:slideL .25s var(--ease);overflow:auto}
.mnav .pane a{padding:14px;border-radius:12px;font-weight:600;color:var(--text);font-size:16px}.mnav .pane a:hover{background:var(--brand-50);color:var(--brand-600)}
.mnav .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}

/* Logo */
.logo{display:inline-flex;align-items:baseline;font-family:var(--font-display);font-weight:700;letter-spacing:-.03em;text-decoration:none;line-height:1}
.logo .a{color:var(--brand-600)}.logo .b{color:var(--ink-900)}
.logo.light .a{color:#7FA3F5}.logo.light .b{color:#fff}
html[data-theme="dark"] .logo .b{color:#fff}
.logo.ef .a{color:var(--cyan)}.logo.ef .b{color:#111}
html[data-theme="dark"] .logo.ef .b{color:#fff}
.logo .sub{font-family:var(--font-body);font-weight:400;letter-spacing:.35em;font-size:.32em;display:block;text-align:center;color:var(--text);margin-top:.15em;margin-left:.15em}

/* Hero */
.hero{background:var(--grad-hero);color:#fff;padding:calc(120px + var(--sat)) 0 90px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;width:720px;height:720px;border-radius:50%;right:-160px;top:-200px;background:radial-gradient(circle,rgba(127,163,245,.35),transparent 65%)}
.hero .in{max-width:1280px;margin:0 auto;padding:0 20px;display:grid;grid-template-columns:1.15fr 1fr;gap:40px;align-items:center;position:relative}
.hero h1{font-size:56px;color:#fff;max-width:14ch;margin-bottom:18px}
.hero h1 .w{display:inline-block;opacity:0;transform:translateY(14px);animation:wordIn .6s var(--ease) forwards}
@keyframes wordIn{to{opacity:1;transform:none}}
.hero p.lead{font-size:18px;color:rgba(255,255,255,.8);max-width:52ch;margin-bottom:28px}
.hero .metrics{display:grid;grid-template-columns:repeat(4,auto);gap:28px;margin-top:40px}
.hero .metrics div b{display:block;font-family:var(--font-display);font-size:30px;letter-spacing:-.02em}
.hero .metrics div span{font-size:13px;color:rgba(255,255,255,.7)}
.scene{position:relative;height:440px}
.scene .gl{position:absolute;border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.28),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(10px);box-shadow:0 30px 60px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.5);animation:float 7s ease-in-out infinite}
.scene .gl.r{border-radius:50%}
.scene .disk{position:absolute;left:50%;bottom:20px;width:380px;height:110px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,rgba(127,163,245,.55),rgba(0,40,133,.1) 70%);filter:blur(2px)}
.scene .pill{position:absolute;padding:10px 16px;border-radius:16px;background:rgba(255,255,255,.95);color:var(--ink-900);font-size:13px;font-weight:600;box-shadow:var(--e3);animation:float 8s ease-in-out infinite;display:flex;gap:8px;align-items:center}
.scene .pill i{width:8px;height:8px;border-radius:50%;background:var(--success)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

/* Secciones públicas */
.sec{padding:80px 0}
.sec.alt{background:var(--brand-50)}
html[data-theme="dark"] .sec.alt{background:#0D1330}
.sec.dark{background:var(--ink-900);color:#fff}.sec.dark h2,.sec.dark h3{color:#fff}
.sec-hd{max-width:640px;margin-bottom:40px}
.sec-hd h2{margin-bottom:10px}.sec-hd p{color:var(--muted);font-size:16px}
.center{text-align:center;margin-left:auto;margin-right:auto}
.marquee{overflow:hidden;white-space:nowrap;padding:18px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--surface)}
.marquee .trk{display:inline-flex;gap:56px;animation:mq 28s linear infinite;padding-left:56px}
.marquee .trk span{font-family:var(--font-display);font-weight:600;font-size:18px;color:var(--ink-300);transition:color .2s}
.marquee .trk span:hover{color:var(--brand-600)}
@keyframes mq{to{transform:translateX(-50%)}}
.ico{width:48px;height:48px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;background:var(--brand-50);color:var(--brand-600);flex:none}
.ico.v{background:var(--violet-50);color:var(--violet)}.ico.c{background:var(--cyan-50);color:#0E8FA0}.ico.g{background:var(--success-50);color:var(--success)}.ico.w{background:var(--warning-50);color:#B45309}
.mvv .card:hover .ico{transform:rotate(-6deg)}.ico{transition:transform .2s var(--ease)}
.svc{position:relative}.svc::after{content:"";position:absolute;inset:-1px;border-radius:var(--r-lg);border:2px solid transparent;transition:border-color .2s;pointer-events:none}.svc:hover::after{border-color:var(--brand-600)}
.svc ul{padding-left:18px;margin:10px 0;font-size:13.5px;color:var(--muted)}
.hscroll{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 4px 18px;margin:0 -4px}
.hscroll>*{scroll-snap-align:start;flex:0 0 300px}
.course-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--e1);display:flex;flex-direction:column;transition:transform .18s var(--ease),box-shadow .18s}
.course-card:hover{transform:translateY(-4px);box-shadow:var(--e3)}
.course-card .cover{height:130px;background:var(--grad-hero);position:relative;padding:14px;display:flex;align-items:flex-end}
.course-card .cover .badge{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.92);color:var(--brand-700)}
.course-card .cover h4{color:#fff;font-size:18px;margin:0}
.course-card .body{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.course-card .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.course-card .price{font-family:var(--font-display);font-size:22px;font-weight:700}
.plan{position:relative;display:flex;flex-direction:column}
.plan.hot{border:2px solid var(--brand-600);transform:scale(1.03);box-shadow:var(--e3)}
.plan .tag{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--brand-600);color:#fff;font-size:11px;font-weight:700;padding:4px 12px;border-radius:99px}
.plan .pr{font-family:var(--font-display);font-size:32px;font-weight:700;letter-spacing:-.02em}.plan .pr small{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0}
.plan ul{list-style:none;padding:0;margin:14px 0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.plan ul li{display:flex;gap:8px;align-items:flex-start}.plan ul li::before{content:"✓";color:var(--success);font-weight:700;flex:none}
.timeline{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;position:relative}
.timeline::before{content:"";position:absolute;left:24px;right:24px;top:24px;height:2px;background:var(--border)}
.timeline .ln{position:absolute;left:24px;top:24px;height:2px;background:var(--brand-600);width:0;transition:width 1.4s var(--ease)}
.timeline.in .ln{width:calc(100% - 48px)}
.timeline .st{position:relative;padding-top:64px}
.timeline .st b{position:absolute;top:0;left:0;width:48px;height:48px;border-radius:50%;background:var(--surface);border:2px solid var(--brand-600);color:var(--brand-600);display:flex;align-items:center;justify-content:center;font-family:var(--font-display)}
.ef-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);padding:40px;display:grid;grid-template-columns:1fr 1.3fr;gap:40px;align-items:center;position:relative;overflow:hidden}
.ef-block::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;left:-120px;top:-120px;background:radial-gradient(circle,rgba(25,193,214,.22),transparent 65%);animation:pulse 4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
.ef-block ul{padding-left:18px;color:var(--muted);font-size:14.5px}
.testi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;flex:0 0 340px}
.testi q{display:block;font-size:15px;margin-bottom:14px;color:var(--text)}
.faq-tabs{margin-bottom:20px}
footer.foot{background:var(--ink-900);color:rgba(255,255,255,.75);padding:60px 0 calc(30px + var(--sab))}
footer.foot h4{color:#fff;font-size:14px;margin-bottom:12px}
footer.foot a{color:rgba(255,255,255,.7);display:block;padding:4px 0;font-size:14px}footer.foot a:hover{color:#fff}
footer.foot .legal{border-top:1px solid rgba(255,255,255,.12);margin-top:36px;padding-top:20px;font-size:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.wa-fab{position:fixed;right:20px;bottom:calc(20px + var(--sab));z-index:60;width:56px;height:56px;border-radius:50%;background:#25D366;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(37,211,102,.4);transition:transform .2s}
.wa-fab:hover{transform:scale(1.06)}
.cookie{position:fixed;left:20px;right:20px;bottom:calc(20px + var(--sab));z-index:70;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 20px;box-shadow:var(--e3);display:flex;gap:16px;align-items:center;flex-wrap:wrap;max-width:760px;margin:0 auto;font-size:13px}
.page-hd{background:var(--grad-hero);color:#fff;padding:calc(110px + var(--sat)) 0 50px}
.page-hd h1{color:#fff;margin-bottom:8px}.page-hd p{color:rgba(255,255,255,.8);max-width:60ch;margin:0}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
.filters .select,.filters .input{width:auto;min-height:40px}
.course-hero{display:grid;grid-template-columns:1fr 360px;gap:32px;align-items:start}
.sticky{position:sticky;top:90px}
.pensum .acc summary{font-size:15px}
.step-bar{display:flex;gap:6px;margin-bottom:28px}
.step-bar div{flex:1;height:6px;border-radius:99px;background:var(--border)}.step-bar div.on{background:var(--brand-600)}
.sum{background:var(--brand-50);border-radius:var(--r-lg);padding:18px}
.sum .r{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}.sum .r.t{border-top:1px solid var(--brand-100);margin-top:8px;padding-top:12px;font-weight:700;font-size:16px}
.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.login .art{background:var(--grad-hero);color:#fff;padding:60px;display:flex;flex-direction:column;justify-content:space-between}
.login .frm{padding:60px 40px;display:flex;flex-direction:column;justify-content:center;max-width:520px;margin:0 auto;width:100%}
.demo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px}
.demo-grid button{text-align:left;padding:12px;border-radius:14px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;display:flex;gap:10px;align-items:center;transition:border-color .15s,transform .15s}
.demo-grid button:hover{border-color:var(--brand-600);transform:translateY(-2px)}
.demo-grid b{display:block;font-size:13px}.demo-grid span{font-size:12px;color:var(--muted)}
.map{height:240px;border-radius:var(--r-lg);background:linear-gradient(135deg,#DDE6FA,#EEF3FF);display:flex;align-items:center;justify-content:center;color:var(--brand-600);font-weight:600;border:1px solid var(--border)}
.cert{border:2px solid var(--brand-600);border-radius:20px;padding:28px;background:var(--surface);text-align:center;position:relative;overflow:hidden}
.cert::before{content:"";position:absolute;inset:8px;border:1px solid var(--brand-100);border-radius:14px;pointer-events:none}
.cert .cn{font-family:var(--font-display);font-size:26px;font-weight:700;margin:14px 0 6px}
.qr{width:84px;height:84px;margin:14px auto 0;background:repeating-conic-gradient(var(--ink-900) 0 25%,transparent 0 50%) 0 0/16px 16px;border:6px solid #fff;outline:1px solid var(--border)}
.verify-box{max-width:560px;margin:0 auto}

/* ============================================================================
   [S03] SHELL DE PORTALES PRIVADOS
   ============================================================================ */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh;transition:grid-template-columns .25s var(--ease)}
.app.collapsed{grid-template-columns:76px 1fr}
.side{background:var(--ink-900);color:#fff;padding:20px 14px calc(20px + var(--sab));display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow:auto}
.side .brand{padding:6px 10px 18px;display:flex;align-items:center;justify-content:space-between}
.side .role{font-size:11px;color:var(--brand-300);font-weight:600;padding:0 10px 10px;letter-spacing:.02em}
.side a.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:rgba(255,255,255,.72);font-weight:500;font-size:14px;white-space:nowrap;position:relative;transition:background .15s,color .15s}
.side a.nav:hover{background:rgba(255,255,255,.08);color:#fff}
.side a.nav.on{background:var(--brand-600);color:#fff}
.side a.nav svg{flex:none}
.side a.nav .cnt{margin-left:auto;background:var(--danger);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px}
.app.collapsed .side a.nav span,.app.collapsed .side .role,.app.collapsed .side .brand .logo{display:none}
.app.collapsed .side a.nav{justify-content:center}
.app.collapsed .side a.nav .cnt{position:absolute;top:6px;right:6px}
.side .grow{flex:1}
.side .user{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:rgba(255,255,255,.06);font-size:13px}
.side .user b{display:block;font-size:13px}.side .user span{color:rgba(255,255,255,.6);font-size:12px}
.main{min-width:0;display:flex;flex-direction:column}
.appbar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:12px;padding-top:calc(12px + var(--sat))}
.appbar .search{flex:1;max-width:420px;display:flex;align-items:center;gap:10px;background:var(--canvas);border:1px solid var(--border);border-radius:var(--r-pill);padding:0 14px;height:40px;color:var(--muted);cursor:pointer;font-size:14px}
.appbar .search span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .search kbd{margin-left:auto;white-space:nowrap;font-family:var(--font-body);font-size:11px;border:1px solid var(--border);border-radius:6px;padding:1px 6px;background:var(--surface)}
.appbar .period{display:flex;gap:4px;background:var(--canvas);border:1px solid var(--border);border-radius:var(--r-pill);padding:3px}
.appbar .period button{border:none;background:transparent;padding:5px 12px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted)}
/* Logo: se renderizan las dos versiones y el CSS elige según el fondo real */
.logo-img{display:inline-flex;align-items:center;line-height:0}
.logo-img img{width:auto;display:block}
.logo-img .lg-white{display:none}
/* Fondos oscuros → versión blanca */
.topbar:not(.solid) .logo-img .lg-color,
.side .logo-img .lg-color,
.login .art .logo-img .lg-color,
.sec.dark .logo-img .lg-color,
.foot .logo-img .lg-color,
.logo-img.light .lg-color{display:none}
.topbar:not(.solid) .logo-img .lg-white,
.side .logo-img .lg-white,
.login .art .logo-img .lg-white,
.sec.dark .logo-img .lg-white,
.foot .logo-img .lg-white,
.logo-img.light .lg-white{display:block}
/* Tema oscuro: fondos claros pasan a oscuros → blanca, salvo tarjetas ya cubiertas */
html[data-theme="dark"] .logo-img .lg-color{display:none}
html[data-theme="dark"] .logo-img .lg-white{display:block}
.appbar .period button.on{background:var(--brand-600);color:#fff}
.sync-badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted);padding:4px 10px;border-radius:99px;background:var(--canvas);border:1px solid var(--border);white-space:nowrap}
.sync-badge i{width:7px;height:7px;border-radius:50%;background:var(--ink-300)}
.sync-badge.ok{color:var(--success)}.sync-badge.ok i{background:var(--success)}
.sync-badge.err{color:var(--danger)}.sync-badge.err i{background:var(--danger)}
.sync-badge.local{color:var(--warning)}.sync-badge.local i{background:var(--warning)}
@media (max-width:767px){.sync-badge span{display:none}}
.content{padding:24px;max-width:1440px;width:100%;flex:1}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ph h1{font-size:28px;margin:0 0 4px}.ph p{margin:0;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
.bottombar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-top:1px solid var(--border);padding:6px 8px var(--sab);justify-content:space-around}
.bottombar a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);padding:6px 10px;border-radius:12px;min-width:56px}
.bottombar a.on{color:var(--brand-600)}
.notif-pane{position:fixed;top:calc(64px + var(--sat));right:20px;width:min(400px,calc(100% - 40px));background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--e3);z-index:70;max-height:70vh;overflow:auto;animation:pop .2s var(--ease)}
.alert-it{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);align-items:flex-start;font-size:13px}
.alert-it .pr{width:10px;height:10px;border-radius:50%;flex:none;margin-top:5px}
.pr-critico{background:var(--danger)}.pr-urgente{background:var(--warning)}.pr-proximo{background:var(--info)}.pr-academico{background:var(--violet)}.pr-ok{background:var(--success)}
.next-class{background:var(--grad-hero);color:#fff;border-radius:var(--r-xl);padding:26px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;position:relative;overflow:hidden}
.next-class::after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;right:-80px;top:-120px;background:radial-gradient(circle,rgba(127,163,245,.4),transparent 65%)}
.next-class h3{color:#fff;margin:6px 0 4px}.next-class .cd{font-family:var(--font-display);font-size:30px;font-weight:700;letter-spacing:-.02em}
.next-class .btn{position:relative}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--border)}
.tl .ti{position:relative;padding:0 0 18px}
.tl .ti::before{content:"";position:absolute;left:-23px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--brand-600)}
.tl .ti.done::before{background:var(--brand-600)}.tl .ti.next::before{border-color:var(--success);background:var(--success)}
.drop{border:2px dashed var(--border);border-radius:var(--r-lg);padding:28px;text-align:center;color:var(--muted);cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--brand-600);background:var(--brand-50)}
.file-it{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:12px;font-size:13px;background:var(--surface)}
.att-btns{display:flex;gap:6px}.att-btns button{flex:1;min-height:40px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;font-weight:600;font-size:12px}
.att-btns button.ok.on{background:var(--success);color:#fff;border-color:var(--success)}.att-btns button.no.on{background:var(--danger);color:#fff;border-color:var(--danger)}.att-btns button.ex.on{background:var(--warning);color:#fff;border-color:var(--warning)}
.dots{display:grid;grid-template-columns:repeat(12,1fr);gap:6px}
.dots i{aspect-ratio:1;border-radius:6px;background:var(--border)}.dots i.a{background:var(--success)}.dots i.n{background:var(--danger)}.dots i.j{background:var(--warning)}
.aging{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.aging div{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center}

const SUPABASE_URL = 'PENDIENTE_CONFIRMAR';
const SUPABASE_ANON_KEY = 'PENDIENTE_CONFIRMAR';
const CLOUD_ROW_ID = 'main';

const sb = CLOUD_ON ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

let lastSyncAt = null; let saveTimer = null; let applyingRemote = false;

function loadLocal() { try { const raw = localStorage.getItem(STORE_KEY); if (raw) { const s = JSON.parse(raw); if (s.v === 5) return s; } } catch (e) { } return null; }
function cacheLocal() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { } }

async function initState() {
  if (!CLOUD_ON) { S = loadLocal() || buildSeed(); return; }
  try {
    const { data, error } = await sb.from('app_state').select('data,updated_at').eq('id', CLOUD_ROW_ID).maybeSingle();
    if (error) throw error;
    if (data && data.data && data.data.v === 5) { S = data.data; lastSyncAt = data.updated_at; }
    else { S = loadLocal() || buildSeed(); await sb.from('app_state').upsert({ id: CLOUD_ROW_ID, data: S, updated_by: CLIENT_ID, updated_at: new Date().toISOString() }); }
    cloudStatus = 'synced'; cacheLocal();
    subscribeRealtime();
  } catch (e) { console.warn('Supabase no disponible, usando copia local:', e.message || e); S = loadLocal() || buildSeed(); cloudStatus = 'error'; }
}
function subscribeRealtime() {
  try {
    sb.channel('app_state_changes').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'app_state', filter: `id=eq.${CLOUD_ROW_ID}` }, payload => {
      const row = payload.new; if (!row || row.updated_by === CLIENT_ID) return; // ignora los propios cambios
      applyingRemote = true; const keepSession = S.session; S = row.data; S.session = keepSession; lastSyncAt = row.updated_at; cacheLocal(); applyingRemote = false;
      render(); toast('Datos actualizados desde otro dispositivo', 'info');
    }).subscribe();
  } catch (e) { /* realtime opcional: si falla, el guardado periódico igual sincroniza */ }
}
function save() {
  cacheLocal(); if (applyingRemote) return;
  if (!CLOUD_ON) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { const now = new Date().toISOString(); const { error } = await sb.from('app_state').update({ data: S, updated_by: CLIENT_ID, updated_at: now }).eq('id', CLOUD_ROW_ID); if (error) throw error; cloudStatus = 'synced'; lastSyncAt = now; }
    catch (e) { cloudStatus = 'error'; console.warn('No se pudo guardar en la nube (se guardó localmente):', e.message || e); }

}

el, GA4) solo con tu consentimiento.</p></div></div></div></div></section>`; }

function Login(msg = '') { return `<div class="login view"><div class="art">${Logo('light', 30)}<div><h2 style="color:#fff">Un solo acceso para toda la fundación</h2><p style="color:rgba(255,255,255,.75);max-width:44ch">Estudiantes, docentes, asesores, tesorería y dirección entran por aquí y ven solo lo que les corresponde.</p></div><div class="caption" style="color:rgba(255,255,255,.5)">${COPY.legal.nombre}</div></div><div class="frm"><a href="#/" class="small" style="margin-bottom:24px">← Volver al sitio</a><h2>Ingresar</h2>${msg ? `<div class="card" style="border-color:var(--warning);background:var(--warning-50);padding:12px 14px;font-size:13px;margin-bottom:14px">${msg}</div>` : ''}<form class="stack" onsubmit="return loginForm(this)"><div class="field"><label>Correo</label><input class="input" name="correo" inputmode="email" placeholder="tu@correo.com"></div><div class="field"><label>Contraseña</label><input class="input" name="clave" type="password" placeholder="••••••••"></div><button class="btn btn-primary">Entrar</button><div class="caption">¿Olvidaste tu clave? Escríbenos por WhatsApp.</div></form><div style="margin-top:28px"><div class="row between"><b class="small">Acceso rápido de demostración</b><span class="caption">Un clic por perfil</span></div><div class="demo-grid">${USERS.map(u => `<button onclick="login('${u.id}')">${avatar(u.nombre, '', ['', 'v', 'c', 'g', 'w'][USERS.indexOf(u)])}<div><b>${u.nombre}</b><span>${u.sub}</span></div></button>`).join('')}</div></div></div></div>`; }

let attDraft = {};
function TeaAttendance(r) { const gs = myGroups(); const gid = r.q.g || gs.find(g => g.estado === 'En curso')?.id || gs[0]?.id; const g = groupOf(gid); if (!g) return ph('Asistencia', '') + empty('Sin grupos', 'No tienes grupos asignados.'); const ses = S.sessions.filter(x => x.grupoId === gid); const sid = r.q.s || ses.filter(x => x.fecha <= iso(TODAY)).slice(-1)[0]?.id || ses[0]?.id; const se = S.sessions.find(x => x.id === sid); const studs = groupStudents(gid); const saved = groupBy(S.attendance.filter(a => a.sesionId === sid), 'estudianteId'); const key = sid; attDraft[key] = attDraft[key] || Object.fromEntries(studs.map(s => [s.id, saved[s.id]?.[0]?.estado || null]));
  const cnt = Object.values(attDraft[key]); const marked = cnt.filter(Boolean).length;
  return ph('Tomar asistencia', 'Marca cada estudiante. Puedes marcar a todos de una vez y corregir después.') + `<div class="toolbar"><select class="select" onchange="location.hash='#/docente/asistencia?g='+this.value">${gs.map(x => `<option value="${x.id}" ${x.id === gid ? 'selected' : ''}>${x.nombre}</option>`).join('')}</select><select class="select" onchange="location.hash='#/docente/asistencia?g=${gid}&s='+this.value">${ses.map(x => `<option value="${x.id}" ${x.id === sid ? 'selected' : ''}>Clase ${x.n} · ${fdate(x.fecha)} · ${x.tema}</option>`).join('')}</select><span class="muted small" style="margin-left:auto">${marked}/${studs.length} marcados</span><button class="btn btn-secondary btn-sm" onclick="studs_all('${key}','Asistió')">Todos asistieron</button></div><div class="card"><div class="stack" style="gap:8px">${studs.map(s => { const v = attDraft[key][s.id]; return `<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--border);gap:12px"><div class="row" style="gap:10px;min-width:0">${avatar(s.nombre, 'sm')}<div style="min-width:0"><b class="small" style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.nombre)}</b><div class="caption">${attendancePct(s.id) === null ? 'Sin registros' : attendancePct(s.id) + ' % asistencia'}</div></div></div><div class="att-btns" style="flex:0 0 240px">${[['Asistió', 'ok'], ['No asistió', 'no'], ['Justificada', 'ex']].map(([l, c]) => `<button class="${c} ${v === l ? 'on' : ''}" onclick="attDraft['${key}']['${s.id}']='${l}';render()">${l}</button>`).join('')}</div></div>`; }).join('')}</div><div class="row between" style="margin-top:16px"><span class="caption">${se ? `Clase ${se.n} · ${fdate(se.fecha)} · ${se.tema}` : ''}</span><button class="btn btn-primary" onclick="saveAttendance('${key}','${gid}')" ${marked < studs.length ? 'disabled title="Marca a todos los estudiantes"' : ''}>Guardar asistencia</button></div></div>`; }
function studs_all(key, v) { Object.keys(attDraft[key]).forEach(k => attDraft[key][k] = v); render(); }
function saveAttendance(sid, gid) { const d = attDraft[sid]; Object.entries(d).forEach(([stId, v]) => { const ex = S.attendance.find(a => a.sesionId === sid && a.estudianteId === stId); if (ex) ex.estado = v; else S.attendance.push({ id: `${stId}-${sid}`, estudianteId: stId, sesionId: sid, grupoId: gid, estado: v }); }); const se = S.sessions.find(x => x.id === sid); if (se) se.estado = 'Realizada'; audit('Asistencia guardada', 'Sesión', sid, '', Object.values(d).filter(v => v === 'Asistió').length + ' asistieron'); save(); render(); toast('Asistencia guardada. Indicadores actualizados.', 'ok'); }
let gradeIdx = 0;

  <div class="card"><div class="row between"><div><span class="badge b-brand">${t.modulo}</span><h3 style="margin:8px 0 2px">${t.titulo}</h3><div class="caption">${esc(s.nombre)} · entregada ${fdate(x.fecha)} ${x.estado === 'Entregada tarde' ? '· <b style="color:var(--danger)">tarde</b>' : ''}</div></div>${sBadge(x.estado)}</div><div class="grid g2" style="margin-top:16px"><div><h4>Archivos</h4><div class="stack" style="gap:6px">${x.archivos.map(f => `<div class="file-it"><span>${I.clip} ${esc(f.n)}</span><button class="btn btn-secondary btn-xs" onclick="toast('Vista previa (demo)')">${I.eye} Ver</button></div>`).join('')}${x.link ? `<div class="file-it"><span>${I.clip} ${esc(x.link)}</span></div>` : ''}</div>${x.comentario ? `<p class="small" style="margin-top:10px"><b>Comentario del estudiante:</b> ${esc(x.comentario)}</p>` : ''}</div><div><h4>Rúbrica</h4>${t.rubrica.map(([c, m], i) => `<div class="row between" style="padding:6px 0"><span class="small">${c}</span><input class="input num" id="rb_${i}" type="number" step="0.1" min="0" max="${m}" value="${x.desglose?.[i]?.[1] ?? ''}" style="width:90px;min-height:36px;text-align:right" oninput="calcGrade(${t.rubrica.length})"><span class="caption">/ ${m}</span></div>`).join('')}<div class="row between" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)"><b>Nota</b><b class="num" id="rb_total" style="font-size:20px">${x.nota ?? '—'}</b><span class="caption">/ ${t.max}</span></div></div></div><div class="field" style="margin-top:14px"><label>Retroalimentación</label><textarea class="textarea" id="rb_fb">${esc(x.feedback)}</textarea></div><div class="row between" style="margin-top:14px"><button class="btn btn-secondary" onclick="returnSub('${x.id}')">Devolver para corregir</button><div class="row"><button class="btn btn-secondary" onclick="gradeIdx=Math.max(0,gradeIdx-1);render()">‹ Anterior</button><button class="btn btn-primary" onclick="saveGrade('${x.id}',${t.rubrica.length})">Guardar y siguiente ›</button></div></div></div></div>`; }
function calcGrade(n) { let t = 0; for (let i = 0; i < n; i++) t += Number($('#rb_' + i).value) || 0; $('#rb_total').textContent = Math.round(t * 10) / 10; }
function saveGrade(id, n) { const x = S.submissions.find(s => s.id === id); const t = ASSIGNMENTS.find(a => a.id === x.tareaId); const des = t.rubrica.map(([c], i) => [c, Number($('#rb_' + i).value) || 0]); const nota = Math.round(sum(des, d => d[1]) * 10) / 10; if (nota > t.max) return toast('La nota supera el máximo de la rúbrica.', 'err'); if (!$('#rb_fb').value.trim()) return toast('Escribe una retroalimentación para el estudiante.', 'err'); x.desglose = des; x.nota = nota; x.feedback = $('#rb_fb').value.trim(); x.estado = 'Calificada'; x.calificadoPor = myTeacherId(); audit('Calificación', 'Entrega', id, '', nota); save(); gradeIdx++; render(); toast(`Nota ${nota} guardada`, 'ok'); }

function streamDias(s){ return dayDiff(s.corte); }
function streamSemaforo(d){ return d < 0 ? ['b-bad','Vencida'] : d <= 1 ? ['b-bad','Vence hoy/mañana'] : d <= 3 ? ['b-warn','Vence 2-3 días'] : d <= 7 ? ['b-warn','Vence esta semana'] : ['b-ok','Sin urgencia']; }
function streamAlertas(rows){
  const list = rows.filter(s => s.estado !== 'Renovada').map(s => ({ s, d: streamDias(s) })).sort((a,b)=>a.d-b.d);
  const urgentes = list.filter(x => x.d <= 7);
  return `<div class="card"><div class="card-hd"><h4>Alertas de contacto — cuentas por renovar</h4><div class="row" style="gap:6px"><span class="badge b-bad">🔴 Hoy/mañana</span><span class="badge b-warn">🟠 2-7 días</span><span class="badge b-ok">✅ Sin urgencia</span></div></div>
  <p class="small muted">${urgentes.length} cuentas requieren contacto esta semana. Escribe al cliente y renueva desde aquí.</p>
  <div class="tbl-wrap"><table class="tbl cards"><thead><tr><th>Servicio</th><th>Cliente</th><th>WhatsApp</th><th>Corte</th><th>Días</th><th>Estado</th><th>Acción</th></tr></thead><tbody>${list.map(({s,d})=>{ const [cls,txt]=streamSemaforo(d); return `<tr><td data-l="Servicio"><b>${s.servicio}</b><div class="caption">${s.plan}</div></td><td data-l="Cliente">${esc(s.cliente)}</td><td data-l="WhatsApp">${s.telefono}</td><td data-l="Corte">${fdate(s.corte)}</td><td data-l="Días" class="num">${d}</td><td data-l="Estado">${badge(txt,cls)}</td><td data-l="Acción"><div class="row" style="gap:4px;flex-wrap:nowrap"><a class="btn btn-wa btn-xs" href="${waLink(s.telefono, tpl('renov',{nombre:s.cliente.split(' ')[0],servicio:s.plan,fecha:fdate(s.corte),valor:fmt(s.precio)}))}" target="_blank" rel="noopener">${I.wa}</a><button class="btn btn-primary btn-xs" onclick="renewStreaming('${s.id}')">Renovar</button></div></td></tr>`; }).join('')}</tbody></table></div></div>`;
}
function streamDashboard(rows){
  const totVenta=sum(rows,'precio'); const iDaniel=sum(rows,s=>(s.comisiones.find(c=>c.r==='Daniel')||{}).v||0); const iDavid=sum(rows,s=>(s.comisiones.find(c=>c.r==='David')||{}).v||0); const gan=sum(rows,s=>s.precio-s.costo-sum(s.comisiones,'v')); const activas=rows.filter(s=>['Activa','Por vencer'].includes(s.estado)).length; const vencidas=rows.filter(s=>s.estado==='Vencida').length;

function streamContabilidad(rows){
  const servicios=[...new Set(rows.map(s=>s.servicio))];
  const monthsAll=Array.from({length:12},(_,i)=>i);
  const table=servicios.map(sv=>{ const list=rows.filter(s=>s.servicio===sv); const byMonth=monthsAll.map(mi=>sum(list.filter(s=>new Date(s.venta+'T12:00:00').getMonth()===mi),'precio')); return {sv, byMonth, total:sum(byMonth,x=>x)}; });
  const colTot=monthsAll.map(mi=>sum(table,t=>t.byMonth[mi]));
  return `<div class="card"><div class="card-hd"><h4>Contabilidad ${TODAY.getFullYear()} — ventas por servicio y mes</h4></div><div class="tbl-wrap"><table class="tbl" style="min-width:900px"><thead><tr><th>Servicio</th>${MONTHS.map(m=>`<th class="money">${m}</th>`).join('')}<th class="money">Total año</th></tr></thead><tbody>${table.map(t=>`<tr><td><b>${t.sv}</b></td>${t.byMonth.map(v=>`<td class="money num">${v?fmt(v):'—'}</td>`).join('')}<td class="money num"><b>${fmt(t.total)}</b></td></tr>`).join('')}<tr style="font-weight:700"><td>TOTAL</td>${colTot.map(v=>`<td class="money num">${fmt(v)}</td>`).join('')}<td class="money num">${fmt(sum(colTot,x=>x))}</td></tr></tbody></table></div></div>`;
}

function apkAlertas(rows){ const open=rows.filter(m=>!['Entregado','Finalizado','Cancelado'].includes(m.estado));
  const list=[]; open.forEach(m=>{const d=dayDiff(m.entregaEst); if(d<=5) list.push({m,tipo:d<0?'Entrega vencida':'Entrega próxima',pri:d<0?'b-bad':'b-warn',dato:d+' días',acc:'Revisar avance con el responsable'}); if(m.saldo>0&&['Listo para entregar','Entregado'].includes(m.estado)) list.push({m,tipo:'Saldo pendiente',pri:'b-bad',dato:fmt(m.saldo),acc:'Cobrar antes de entregar accesos'});});
  rows.forEach(m=>{const dd=dayDiff(m.renovDominio); if(dd>=0&&dd<=45) list.push({m,tipo:'Renovación dominio',pri:'b-warn',dato:fdate(m.renovDominio),acc:'Cobrar renovación de '+m.dominio});});

      return `<tr><td class="clip">${esc(st.nombre)}</td>${ses.map(x=>{const a=att.find(y=>y.sesionId===x.id);return `<td><i style="display:inline-block;width:14px;height:14px;border-radius:4px;background:${!a?'var(--border)':a.estado==='Asistió'?'var(--success)':a.estado==='No asistió'?'var(--danger)':'var(--warning)'}" title="${a?a.estado:'—'}"></i></td>`}).join('')}<td class="num">${asis}</td><td class="num">${no}</td><td class="num">${p===null?'—':p+'%'}</td><td>${p===null?'—':badge(p>=S.config.asistenciaMin?'Cumple':'En riesgo',p>=S.config.asistenciaMin?'b-ok':'b-bad')}</td></tr>`}).join('')}</tbody></table></div></div>`}).join('')||`<div class="card">${empty('Sin grupos con asistencia','Aún no se ha registrado asistencia en esta unidad.')}</div>`;
}

function cursoCertificacion(rows,u){ return `<div class="card"><div class="card-hd"><h4>Certificación</h4><span class="caption">Requisitos: ${S.config.asistenciaMin}% asistencia · 100% progreso · saldo en cero</span></div><div class="tbl-wrap"><table class="tbl cards"><thead><tr><th>Estudiante</th><th>Grupo</th><th>Estado académico</th><th>% Asistencia</th><th>% Progreso</th><th>Saldo</th><th>Resultado</th></tr></thead><tbody>${rows.map(s=>{const a=attendancePct(s.id),pr=progressPct(s.id); const ok=a!==null&&a>=S.config.asistenciaMin&&pr===100&&s.saldo===0; const casi=a!==null&&a>=S.config.asistenciaMin&&s.saldo===0;

function cursoContabilidad(rows,u){ const pays=S.payments.filter(p=>p.unidad===u.slug&&p.fechaPago); const ex=S.expenses.filter(e=>e.unidad===u.slug);

function cursoAlertas(rows,u){ const al=[]; rows.forEach(s=>{ const a=attendancePct(s.id); const pend=S.payments.filter(p=>p.estudianteId===s.id&&p.saldo>0);
  pend.forEach(p=>{const d=dayDiff(p.vencimiento); if(d<=3) al.push({t:d<0?'Pago vencido':'Cuota por vencer',s,sit:p.concepto+' · '+fmt(p.saldo),pri:d<0?'b-bad':'b-warn',acc:'Recordatorio de pago',msg:tpl('pago',{nombre:s.nombre.split(' ')[0],valor:fmt(p.saldo),fecha:fdate(p.vencimiento)})});});
  if(a!==null&&a<S.config.asistenciaMin) al.push({t:'Asistencia baja',s,sit:a+' % de asistencia',pri:'b-bad',acc:'Contacto de retención',msg:'Hola '+s.nombre.split(' ')[0]+', te extrañamos en clase. ¿Cómo podemos ayudarte?'}); });
  return `<div class="card"><div class="card-hd"><h4>Alertas de la unidad</h4><span class="caption">${al.length} situaciones</span></div><div class="tbl-wrap"><table class="tbl cards"><thead><tr><th>Tipo</th><th>Estudiante</th><th>Grupo</th><th>Situación</th><th>Acción recomendada</th><th></th></tr></thead><tbody>${al.map(x=>`<tr><td data-l="Tipo">${badge(x.t,x.pri)}</td><td data-l="Estudiante"><b>${esc(x.s.nombre)}</b><div class="caption">${x.s.telefono}</div></td><td data-l="Grupo">${groupOf(x.s.grupoId)?groupOf(x.s.grupoId).nombre:'—'}</td><td data-l="Situación">${x.sit}</td><td data-l="Acción">${x.acc}</td><td data-l=""><a class="btn btn-wa btn-xs" href="${waLink(x.s.telefono,x.msg)}" target="_blank" rel="noopener">${I.wa}</a></td></tr>`).join('')||'<tr><td colspan="6">'+empty('Todo al día','No hay alertas en esta unidad.')+'</td></tr>'}</tbody></table></div></div>`; }

function openGeneric(col, id) { const x = S[col].find(i => i.id === id); const skip = ['id', 'items', 'historial', 'obs', 'clave', 'usuario', 'pin']; const lbl = k => k.replace(/([A-Z])/g, ' $1').replace(/^./, c => c.toUpperCase()); const isDate = v => /^\d{4}-\d{2}-\d{2}$/.test(String(v)); const isMoney = k => /precio|costo|pagado|saldo|total|anticipo|comision|valor/i.test(k); const fields = Object.entries(x).filter(([k, v]) => !skip.includes(k) && (typeof v !== 'object' || v === null)); const stField = col === 'videos' ? 'etapa' : 'estado'; const stages = col === 'videos' ? unitBy('videos-ia').kanban.stages : col === 'microapps' ? ['Nuevo cliente', 'Cotización enviada', 'Esperando aprobación', 'Anticipo pendiente', 'Anticipo pagado', 'Recolección de información', 'Diseño', 'Desarrollo', 'En revisión', 'Cambios solicitados', 'Pruebas', 'Pendiente del cliente', 'Listo para entregar', 'Entregado', 'Soporte', 'Mantenimiento', 'Finalizado', 'Cancelado'] : ['Cotizado', 'Confirmado', 'Alistando', 'Despachado', 'Entregado']; drawer(`<div class="detail-grid">${fields.map(([k, v]) => `<div><span>${lbl(k)}</span>${isDate(v) ? fdate(v) : isMoney(k) && typeof v === 'number' ? '<b class="num">' + fmt(v) + '</b>' : esc(v === null ? '—' : v)}</div>`).join('')}</div>${x.items ? `<h4 style="margin-top:16px">Ítems</h4><table class="mini-t">${x.items.map(i => `<tr><td class="small">${i.nombre}<div class="caption">${i.sku}</div></td><td class="num">${i.q} × ${fmt(i.precio)}</td><td class="num" style="text-align:right"><b>${fmt(i.q * i.precio)}</b></td></tr>`).join('')}</table>` : ''}<div class="row" style="margin-top:16px"><select class="select" style="min-height:36px;width:auto;font-size:13px" onchange="const x=S['${col}'].find(i=>i.id==='${id}');audit('Estado','${col}','${id}',x['${stField}'],this.value);x['${stField}']=this.value;save();render();toast('Actualizado','ok')">${stages.map(s => `<option ${s === x[stField] ? 'selected' : ''}>${s}</option>`).join('')}</select>${x.telefono ? `<a class="btn btn-wa btn-sm" href="${waLink(x.telefono, 'Hola ' + (x.cliente || '').split(' ')[0] + ', te escribimos de PubliFuturo sobre ' + (x.plan || x.tipo || 'tu pedido') + '.')}" target="_blank" rel="noopener">${I.wa} WhatsApp</a>` : ''}${x.saldo > 0 ? `<button class="btn btn-primary btn-sm" onclick="(function(){const x=S['${col}'].find(i=>i.id==='${id}');const v=x.saldo;x.pagado+=v;x.saldo=0;audit('Pago recibido','${col}','${id}','',v);save();closeLayer();render();toast('Pago de '+fmt(v)+' registrado','ok')})()">Registrar pago del saldo</button>` : ''}</div><div class="field" style="margin-top:14px"><label>Observaciones / cambios solicitados</label><textarea class="textarea" style="min-height:60px" onchange="S['${col}'].find(i=>i.id==='${id}').obs=this.value;save();toast('Guardado','ok')">${esc(x.obs || '')}</textarea></div>`, x.id); }
function importExcel(slug) { const u = unitBy(slug); modal(`<p class="small muted">Acepta los libros actuales de la fundación (.xlsx o .csv). Detecta la fila de encabezado y mapea las columnas contra el esquema de <b>${u.n}</b>.</p><div class="drop" onclick="simulateImport('${slug}')">${I.upload}<div style="margin-top:6px"><b>Selecciona el archivo</b></div><div class="caption">Encabezados reconocidos: NOMBRE COMPLETO, TELÉFONO, SALDO PENDIENTE, % ASISTENCIA, ORIGEN DEL CLIENTE, GANANCIA NETA, N° ORDEN…</div></div><div id="imp_res"></div>`, { title: 'Importar desde Excel' }); }
function simulateImport(slug) { $('#imp_res').innerHTML = `<div class="card" style="margin-top:14px"><h4>Correspondencia de columnas</h4><table class="mini-t">${[['NOMBRE COMPLETO', 'nombre', true], ['TELÉFONO', 'telefono', true], ['CIUDAD', 'ciudad', true], ['VALOR FINAL', 'precioFinal', true], ['SALDO PENDIENTE', 'saldo', true], ['OBSERVACIONES', 'obs', true], ['COLUMNA X', '—', false]].map(([a, b, ok]) => `<tr><td class="small">${a}</td><td>→</td><td>${ok ? badge(b, 'b-ok') : badge('sin mapear', 'b-warn')}</td></tr>`).join('')}</table><div class="row between" style="margin-top:12px"><span class="caption">27 filas válidas · 2 con error (teléfono inválido)</span><button class="btn btn-primary btn-sm" onclick="audit('Importación Excel','${slug}','27 filas');save();closeLayer();toast('27 registros importados (demo)','ok')">Confirmar carga</button></div></div>`; }
function AdmClients() { const map = {}; const add = (k, n, tel, ciudad, u, v, p) => { const c = map[k] = map[k] || { id: k, nombre: n, telefono: tel, ciudad, compras: 0, unidades: new Set(), total: 0, pagado: 0, ultima: '' }; c.compras++; c.unidades.add(u); c.total += v; c.pagado += p; }; S.students.forEach(s => add(s.telefono, s.nombre, s.telefono, s.ciudad, s.unidad, s.precioFinal, s.pagado)); S.serviceOrders.forEach(o => add(o.telefono, o.cliente, o.telefono, 'Ibagué', 'servicio-tecnico', o.precio, o.abono)); S.microapps.forEach(m => add(m.telefono, m.empresa, m.telefono, m.ciudad, 'microapps', m.precio, m.pagado)); S.videos.forEach(v => add(v.telefono, v.empresa, v.telefono, 'Ibagué', 'videos-ia', v.precio, v.pagado)); S.streaming.forEach(s => add(s.telefono, s.cliente, s.telefono, 'Ibagué', 'streaming', s.precio, s.pagado)); S.wholesale.forEach(w => add(w.telefono, w.negocio, w.telefono, w.ciudad, 'accesorios-mayor', w.total, w.pagado)); const rows = Object.values(map).map(c => ({ ...c, unidades: [...c.unidades].map(unitName).join(', '), saldo: c.total - c.pagado, siguiente: c.unidades.has('semilleros') && !c.unidades.has('crecimiento-digital') ? 'Crecimiento Digital' : c.unidades.has('crecimiento-digital') && !c.unidades.has('master-digital-360') ? 'Máster Digital 360' : c.unidades.has('microapps') ? 'Videos con IA' : 'Plan de acompañamiento' }));
  return ph('Clientes', `${rows.length} clientes únicos con historial cruzado entre unidades y siguiente producto recomendado.`) + `<div class="kpis">${stat('Clientes', rows.length)}${stat('Valor de vida promedio', fmt(sum(rows, 'total') / rows.length))}${stat('Con más de una unidad', rows.filter(r => r.unidades.includes(',')).length)}${stat('Cartera total', fmt(sum(rows, 'saldo')))}</div>` + table('clients', rows, [{ k: 'nombre', l: 'Cliente', clip: true }, { k: 'telefono', l: 'WhatsApp' }, { k: 'ciudad', l: 'Ciudad' }, { k: 'compras', l: 'Compras' }, { k: 'unidades', l: 'Unidades', clip: true }, { k: 'total', l: 'Valor de vida', money: true, v: r => fmt(r.total) }, { k: 'saldo', l: 'Saldo', money: true, v: r => fmt(r.saldo) }, { k: 'siguiente', l: 'Recomendar', r: r => badge(r.siguiente, 'b-violet') }], { row: r => `<a class="btn btn-wa btn-xs" href="${waLink(r.telefono, 'Hola ' + r.nombre.split(' ')[0] + ', te escribimos de PubliFuturo. Tenemos algo pensado para ti: ' + r.siguiente + '.')}" target="_blank" rel="noopener">${I.wa}</a>` }); }

function FinanceView(r) { const sub = r.seg[1] || ''; const v = { '': FinHome, cobrar: FinReceivables, movimientos: FinMovements, resultados: FinPL, flujo: FinCashflow, comisiones: FinCommissions, esal: FinESAL }[sub]; return v ? v(r) : NotFound(); }
const monthSum = (list, k) => sum(list.filter(x => x.fecha && monthKey(x.fecha) === k), 'valor');
function FinHome() { const inc = incomes(), exp = S.expenses; const k0 = last6[5].k, k1 = last6[4].k; const i0 = monthSum(inc, k0), i1 = monthSum(inc, k1), e0 = monthSum(exp, k0), e1 = monthSum(exp, k1); const rec = receivables(); const d = (a, b) => b ? Math.round((a - b) / b * 100) : 0; const caja = sum(inc, 'valor') - sum(exp, 'valor'); const byM = last6.map(m => ({ i: monthSum(inc, m.k), e: monthSum(exp, m.k) })); const byMethod = groupBy(inc.filter(i => inPeriod(i.fecha)), 'metodo');
  return ph('Panel financiero', 'Tesorería de la fundación: ingresos, egresos, cartera y caja.') + `<div class="kpis">${stat('Ingresos del mes', fmt(i0), d(i0, i1), byM.map(x => x.i))}${stat('Egresos del mes', fmt(e0), d(e0, e1), byM.map(x => x.e))}${stat('Utilidad neta', fmt(i0 - e0), d(i0 - e0, i1 - e1))}${stat('Cartera por cobrar', fmt(sum(rec, 'saldo')))}${stat('Cartera vencida', fmt(sum(rec.filter(x => x.mora > 0), 'saldo')))}${stat('Disponible en caja', fmt(caja))}</div><div class="grid g2"><div class="card"><h4>Ingresos vs. egresos</h4>${barChart(last6.map(m => m.l), [{ n: 'Ingresos', v: byM.map(x => x.i), c: 'var(--brand-600)' }, { n: 'Egresos', v: byM.map(x => x.e), c: 'var(--danger)' }])}</div><div class="card"><h4>Conciliación por medio de pago</h4>${donut(Object.entries(byMethod).map(([n, l]) => ({ n, v: sum(l, 'valor') })), { center: short(sum(inc.filter(i => inPeriod(i.fecha)), 'valor')) })}</div><div class="card"><h4>Ingresos por unidad</h4>${barChart(UNITS.map(u => u.n.split(' ')[0]), [{ n: 'Ventas', v: UNITS.map(u => unitSales(u.slug)) }])}</div><div class="card"><div class="card-hd"><h4>Mayores deudores</h4><a href="#/cartera/cobrar" class="small">Ver cartera</a></div>${rec.sort((a, b) => b.saldo - a.saldo).slice(0, 6).map(x => `<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--border)"><div><b class="small">${esc(x.deudor)}</b><div class="caption">${unitName(x.unidad)} · ${x.mora ? x.mora + ' días de mora' : 'al día'}</div></div><b class="num small" style="color:${x.mora > 30 ? 'var(--danger)' : 'inherit'}">${fmt(x.saldo)}</b></div>`).join('')}</div></div>`; }

uditoría y retira el saldo de la cartera.',function(){toast('Marcado como incobrable (demo)','info')},true)">Incobrable</button>` : ''}</div>` }); }
function paymentPlan(pid) { const p = S.payments.find(x => x.id === pid); const s = studentOf(p.estudianteId); modal(`<p class="small muted">Divide el saldo de <b>${fmt(p.saldo)}</b> de ${esc(s.nombre)} en nuevas cuotas.</p><div class="grid g2" style="gap:12px"><div class="field"><label>Número de cuotas</label><select class="select" id="pp_n">${[2, 3, 4].map(n => `<option>${n}</option>`).join('')}</select></div><div class="field"><label>Primera fecha</label><input class="input" type="date" id="pp_d" value="${iso(addDays(TODAY, 7))}"></div></div>`, { title: 'Acuerdo de pago', footer: `<button class="btn btn-secondary" onclick="closeLayer()">Cancelar</button><button class="btn btn-primary" onclick="(function(){const p=S.payments.find(x=>x.id==='${pid}');const n=Number($('#pp_n').value);const d0=new Date($('#pp_d').value+'T12:00:00');const v=Math.round(p.saldo/n);const base=p.id.split('-Q')[0];for(let i=0;i<n;i++){S.payments.push({...p,id:base+'-A'+(i+1),concepto:'Acuerdo '+(i+1)+'/'+n,cuota:90+i,programado:v,pagado:0,saldo:v,vencimiento:iso(addDays(d0,i*15)),fechaPago:null,estado:'Acuerdo de pago',comprobante:''})}p.saldo=0;p.estado='Acuerdo de pago';p.programado=p.pagado;audit('Acuerdo de pago','Pago','${pid}','',n+' cuotas');save();closeLayer();render();toast('Acuerdo creado en '+n+' cuotas','ok')})()">Crear acuerdo</button>` }); }
function FinMovements() { const rows = allTx().map(t => ({ ...t, unidadN: unitName(t.unidad), fechaF: fdate(t.fecha) })); return ph('Ingresos y egresos', 'Libro de movimientos consolidado de todas las unidades.', `<button class="btn btn-primary btn-sm" onclick="newExpense()">${I.plus} Registrar egreso</button>`) + `<div class="kpis">${stat('Ingresos (6 meses)', fmt(sum(rows.filter(t => t.tipo === 'ingreso'), 'valor')))}${stat('Egresos (6 meses)', fmt(sum(rows.filter(t => t.tipo === 'egreso'), 'valor')))}${stat('Movimientos', rows.length)}</div>` + table('tx', rows, [{ k: 'fecha', l: 'Fecha', v: t => fdate(t.fecha) }, { k: 'tipo', l: 'Tipo', r: t => badge(t.tipo === 'ingreso' ? 'Ingreso' : 'Egreso', t.tipo === 'ingreso' ? 'b-ok' : 'b-bad') }, { k: 'unidadN', l: 'Unidad' }, { k: 'categoria', l: 'Categoría' }, { k: 'concepto', l: 'Concepto', clip: true }, { k: 'valor', l: 'Valor', money: true, v: t => fmt(t.valor) }, { k: 'metodo', l: 'Medio' }, { k: 'responsable', l: 'Responsable' }, { k: 'comprobante', l: 'Comprobante' }], { filters: [{ k: 'tipo', l: 'Tipo' }, { k: 'unidadN', l: 'Unidad' }, { k: 'categoria', l: 'Categoría' }, { k: 'metodo', l: 'Medio' }], size: 15 }); }

function FinPL() { const rows = UNITS.map(u => { const st = S.students.filter(s => s.unidad === u.slug); const isC = !!u.filter; const bruto = unitSales(u.slug); const desc = isC ? sum(st, 'descuento') : 0; const neto = bruto - desc; const costo = isC ? sum(st, s => courseOf(s.cursoId).costo) : { 'servicio-tecnico': sum(S.serviceOrders, 'repuestos'), 'videos-ia': sum(S.videos, 'costo'), 'microapps': sum(S.microapps, m => m.costoDev + m.costoDominio + m.costoApis), 'streaming': sum(S.streaming, 'costo'), 'accesorios-mayor': sum(S.wholesale, 'costo') }[u.slug]; const comA = isC ? Math.round(neto * S.config.comAsesor / 100) : { 'servicio-tecnico': sum(S.serviceOrders, 'comision'), 'videos-ia': sum(S.videos, 'comisiones'), 'microapps': sum(S.microapps, 'comisiones'), 'streaming': sum(S.streaming, s => sum(s.comisiones, 'v')), 'accesorios-mayor': 0 }[u.slug]; const comD = isC ? Math.round(neto * S.config.comDocente / 100) : 0; const ex = S.expenses.filter(e => e.unidad === u.slug); const pub = sum(ex.filter(e => e.categoria === 'Publicidad'), 'valor'); const otros = sum(ex.filter(e => e.categoria !== 'Publicidad'), 'valor'); const util = neto - costo - comA - comD - pub - otros; return { n: u.n, bruto, desc, neto, costo, comA, comD, pub, otros, util, margen: neto ? Math.round(util / neto * 100) : 0 }; }); const T = k => sum(rows, k); const lines = [['Ingresos brutos', 'bruto'], ['Descuentos', 'desc'], ['Ingreso neto', 'neto'], ['Costo directo', 'costo'], ['Comisión asesor', 'comA'], ['Comisión docente', 'comD'], ['Costo publicitario', 'pub'], ['Otros costos', 'otros'], ['Utilidad neta', 'util']]; const fixed = sum(S.expenses.filter(e => e.unidad === 'fundacion'), 'valor') / 6 + 1800000; const avgMargin = T('neto') ? T('util') / T('neto') : .3; const be = Math.round(fixed / Math.max(.05, avgMargin));
  return ph('Estado de resultados por unidad', 'P&L de las once unidades con margen y punto de equilibrio mensual.') + `<div class="tbl-wrap" style="margin-bottom:20px"><table class="tbl" style="min-width:1100px"><thead><tr><th>Concepto</th>${rows.map(r => `<th class="money">${r.n.split(' ').slice(0, 2).join(' ')}</th>`).join('')}<th class="money">Total</th></tr></thead><tbody>${lines.map(([l, k]) => `<tr ${k === 'util' || k === 'neto' ? 'style="font-weight:700"' : ''}><td>${l}</td>${rows.map(r => `<td class="money num" style="${k === 'util' && r[k] < 0 ? 'color:var(--danger)' : ''}">${fmt(r[k])}</td>`).join('')}<td class="money num">${fmt(T(k))}</td></tr>`).join('')}<tr><td>Margen</td>${rows.map(r => `<td class="money">${badge(r.margen + ' %', r.margen >= 30 ? 'b-ok' : r.margen >= 10 ? 'b-warn' : 'b-bad')}</td>`).join('')}<td class="money">${badge(Math.round(avgMargin * 100) + ' %', 'b-brand')}</td></tr></tbody></table></div><div class="grid g2"><div class="card"><h4>Contribución por unidad</h4>${barChart(rows.map(r => r.n.split(' ')[0]), [{ n: 'Utilidad', v: rows.map(r => Math.max(0, r.util)), c: 'var(--success)' }])}</div><div class="card"><h4>Punto de equilibrio mensual</h4><div class="stat" style="border:none;padding:0;box-shadow:none"><div class="lbl">Ventas mínimas para cubrir costos fijos</div><div class="val num">${fmt(be)}</div></div><p class="small muted" style="margin-top:10px">Costos fijos estimados ${fmt(Math.round(fixed))} / mes ÷ margen de contribución ${Math.round(avgMargin * 100)} %. Ventas del último mes: <b>${fmt(monthSum(incomes(), last6[5].k))}</b>.</p>${bar(monthSum(incomes(), last6[5].k) / be * 100, monthSum(incomes(), last6[5].k) >= be ? 'ok' : 'warn')}</div></div>`; }
function FinCashflow() { const caja0 = sum(incomes(), 'valor') - sum(S.expenses, 'valor'); const weeks = Array.from({ length: 13 }, (_, i) => ({ l: 'S' + (i + 1), a: iso(addDays(TODAY, i * 7)), b: iso(addDays(TODAY, i * 7 + 6)) })); const inW = w => sum(S.payments.filter(p => p.saldo > 0 && p.vencimiento >= w.a && p.vencimiento <= w.b), 'saldo') + sum(S.streaming.filter(s => s.corte >= w.a && s.corte <= w.b), 'precio') * .7; const outW = w => 650000 + sum(S.microapps.filter(m => m.renovDominio >= w.a && m.renovDominio <= w.b), () => 60000) + (Number(w.l.slice(1)) % 4 === 0 ? 2200000 : 0); let bal = caja0; const proj = weeks.map(w => { bal += inW(w) - outW(w); return bal; }); const below = proj.findIndex(v => v < S.config.saldoMinimo);
