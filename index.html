function TeaAttendance(r) { const gs = myGroups(); const gid = r.q.g || gs.find(g => g.estado === 'En curso')?.id || gs[0]?.id; const g = groupOf(gid); if (!g) return ph('Asistencia', '') + empty('Sin grupos', 'No tienes grupos asignados.'); const ses = S.sessions.filter(x => x.grupoId === gid); const sid = r.q.s || ses.filter(x => x.fecha <= iso(TODAY)).slice(-1)[0]?.id || ses[0]?.id; const se = S.sessions.find(x => x.id === sid); const studs = groupStudents(gid); const saved = groupBy(S.attendance.filter(a => a.sesionId === sid), 'estudianteId'); const key = sid; attDraft[key] = attDraft[key] || Object.fromEntries(studs.map(s => [s.id, saved[s.id]?.[0]?.estado || null]));

e ›</button></div></div></div></div>`; }
function calcGrade(n) { let t = 0; for (let i = 0; i < n; i++) t += Number($('#rb_' + i).value) || 0; $('#rb_total').textContent = Math.round(t * 10) / 10; }
function saveGrade(id, n) { const x = S.submissions.find(s => s.id === id); const t = ASSIGNMENTS.find(a => a.id === x.tareaId); const des = t.rubrica.map(([c], i) => [c, Number($('#rb_' + i).value) || 0]); const nota = Math.round(sum(des, d => d[1]) * 10) / 10; if (nota > t.max) return toast('La nota supera el máximo de la rúbrica.', 'err'); if (!$('#rb_fb').value.trim()) return toast('Escribe una retroalimentación para el estudiante.', 'err'); x.desglose = des; x.nota = nota; x.feedback = $('#rb_fb').value.trim(); x.estado = 'Calificada'; x.calificadoPor = myTeacherId(); audit('Calificación', 'Entrega', id, '', nota); save(); gradeIdx++; render(); toast(`Nota ${nota} guardada`, 'ok'); }

/* ---- Vista académica del comercial: editar asistencia, pagos y certificados (items 26, 27, 28, 29) ---- */
let acadTab='asistencia'; let acadGrupo='';
/* ============================================================================
   MENSUALIDADES — cobros recurrentes (mensual o anual) de cualquier servicio
   ============================================================================ */
// Estado del ciclo actual: qué periodo toca cobrar, cuándo vence y si ya se pagó
function subEstado(s) {
  const anual = s.modalidad === 'Anual'; const dia = Math.min(Math.max(1, s.diaCobro || 1), 28);
  const ini = new Date(s.inicio + 'T00:00:00');
  const clave = d => anual ? String(d.getFullYear()) : iso(d).slice(0, 7);
  const pagados = new Set((s.pagos || []).map(p => anual ? String(p.periodo).slice(0, 4) : String(p.periodo).slice(0, 7)));
  // Ciclos de cobro desde el inicio hasta poco más de un año adelante
  const ciclos = []; const d = new Date(ini.getFullYear(), ini.getMonth(), dia);
  const tope = new Date(TODAY); tope.setDate(tope.getDate() + 400);
  while (d <= tope && ciclos.length < 240) { ciclos.push(new Date(d)); if (anual) d.setFullYear(d.getFullYear() + 1); else d.setMonth(d.getMonth() + 1); }
  const horizonte = new Date(TODAY); horizonte.setDate(horizonte.getDate() + 5);
  // El ciclo a mostrar es el MÁS ANTIGUO sin pagar (nunca se esconde una deuda)
  const pendiente = ciclos.find(c => c <= horizonte && !pagados.has(clave(c)));
  const c = pendiente || ciclos.find(x => x > TODAY) || ciclos[ciclos.length - 1];
  const dias = dayDiff(iso(c)); const valor = anual ? s.valorAnual : s.valorMensual;
  const nVencidos = ciclos.filter(x => x < TODAY && !pagados.has(clave(x))).length;
  let est = pendiente ? (dias < 0 ? 'Vencido' : 'Por vencer') : 'Al día';
  if (s.estado !== 'Activa') est = s.estado;
  return { periodo: clave(c), venc: iso(c), dias, valor, pagado: !pendiente, est, nVencidos, deuda: nVencidos * valor };
}
function subMsg(s, e) { const per = s.modalidad === 'Anual' ? 'anualidad ' + e.periodo : 'mensualidad de ' + MONTHS[+e.periodo.slice(5, 7) - 1];
  return `¡Hola *${s.cliente.split(' ')[0]}*! 👋\n\nTe escribimos de *PubliFuturo* para recordarte la *${per}* de tu servicio *${s.servicio}*.\n\n💰 Valor: *${fmt(e.valor)}*\n📅 Fecha de cobro: *${fdate(e.venc)}*\n\nPuedes pagar por *Nequi*, *Daviplata* o *Bancolombia*. ¡Gracias por confiar en nosotros! 🙌`; }
const mrr = list => sum(list.filter(s => s.estado === 'Activa'), s => s.modalidad === 'Anual' ? s.valorAnual / 12 : s.valorMensual);

let subFiltro = 'todas';
function Mensualidades() {
  const all = S.subs || []; const activas = all.filter(s => s.estado === 'Activa');
  const conEst = all.map(s => ({ s, e: subEstado(s) }));
  const vencidas = conEst.filter(x => x.s.estado === 'Activa' && x.e.est === 'Vencido');
  const porVencer = conEst.filter(x => x.s.estado === 'Activa' && x.e.est === 'Por vencer');
  const cobradoMes = sum(all.flatMap(s => (s.pagos || []).filter(p => p.fecha && p.fecha.slice(0, 7) === iso(TODAY).slice(0, 7))), 'valor');
  const pendMes = sum(conEst.filter(x => x.s.estado === 'Activa' && !x.e.pagado), x => Math.max(x.e.deuda, x.e.valor));
  return ph('🔁 Mensualidades', 'Cobros <b>recurrentes</b> de cualquier servicio: aplicativos, planes, videos, asesorías. El sistema avisa <b>cada mes</b> a quién hay que cobrarle.',
    `<button class="btn btn-primary btn-sm" onclick="newSub()">${I.plus} Nueva mensualidad</button>`)
    + `<div class="kpis">${stat('Ingreso recurrente / mes', fmt(Math.round(mrr(all))))}${stat('Proyección anual', fmt(Math.round(mrr(all) * 12)))}${stat('Suscripciones activas', activas.length)}${stat('Cobrado este mes', fmt(cobradoMes))}${stat('Por cobrar (incluye mora)', fmt(pendMes))}${stat('Vencidas', vencidas.length)}</div>`
    + (vencidas.length || porVencer.length ? `<div class="card sub-alert" style="margin-bottom:20px"><div class="card-hd"><h4>⏰ Cobros que requieren atención</h4><span class="caption">${vencidas.length} vencidos · ${porVencer.length} vencen en 5 días o menos</span></div>${vencidas.concat(porVencer).map(({ s, e }) => `<div class="sub-row"><span class="sub-dot ${e.est === 'Vencido' ? 'bad' : 'warn'}"></span><div style="flex:1;min-width:0"><b class="small">${esc(s.cliente)}</b> ${catChip(s.cat)}<div class="caption">${esc(s.servicio)} · ${e.est === 'Vencido' ? (e.nVencidos > 1 ? e.nVencidos + ' periodos sin pagar' : 'vencida hace ' + (-e.dias) + ' días') : e.dias === 0 ? 'vence hoy' : 'vence en ' + e.dias + ' días'}</div></div><b class="num small">${fmt(e.deuda || e.valor)}</b><div class="row" style="gap:5px;flex-wrap:nowrap"><a class="btn btn-wa btn-xs" href="${waLink(s.telefono, subMsg(s, e))}" target="_blank" rel="noopener">${I.wa}</a><button class="btn btn-primary btn-xs" onclick="paySub('${s.id}')">Registrar pago</button></div></div>`).join('')}</div>` : '')
    + `<div class="row" style="margin-bottom:14px"><div class="tabs">${[['todas', 'Todas'], ['Vencido', 'Vencidas'], ['Por vencer', 'Por vencer'], ['Al día', 'Al día'], ['inactivas', 'Pausadas / canceladas']].map(([k, l]) => `<button class="${subFiltro === k ? 'on' : ''}" onclick="subFiltro='${k}';render()">${l}</button>`).join('')}</div></div>`
    + subsLista(all.filter(s => { const e = subEstado(s); return subFiltro === 'todas' ? true : subFiltro === 'inactivas' ? s.estado !== 'Activa' : s.estado === 'Activa' && e.est === subFiltro; }), null);
}
function subsLista(list, u) {
  const head = u ? `<div class="kpis" style="margin-bottom:16px">${stat('Recurrente / mes', fmt(Math.round(mrr(list))))}${stat('Activas', list.filter(s => s.estado === 'Activa').length)}${stat('Vencidas', list.filter(s => s.estado === 'Activa' && subEstado(s).est === 'Vencido').length)}</div><div class="row between" style="margin-bottom:12px"><span class="small muted">Cobros recurrentes de <b>${esc(u.n)}</b>. También los ves todos juntos en <a href="#/admin/mensualidades"><b>Mensualidades</b></a>.</span><button class="btn btn-primary btn-sm" onclick="newSub('${u.slug}')">${I.plus} Nueva mensualidad</button></div>` : '';
  if (!list.length) return head + `<div class="card">${empty('Sin mensualidades', 'Registra los servicios que se cobran <b>cada mes</b> o <b>cada año</b> y el sistema te avisará cuándo cobrar.', `<button class="btn btn-primary" style="margin-top:12px" onclick="newSub(${u ? `'${u.slug}'` : ''})">${I.plus} Nueva mensualidad</button>`)}</div>`;
  return head + `<div class="card" style="padding:0;overflow:hidden"><div class="tbl-wrap"><table class="tbl cards"><thead><tr><th>Cliente</th><th>Servicio</th><th>Modalidad</th><th class="money">Mensual</th><th class="money">Anual</th><th>Próximo cobro</th><th>Estado</th><th>Pagos</th><th></th></tr></thead><tbody>${list.map(s => { const e = subEstado(s); const cls = { 'Al día': 'b-ok', Vencido: 'b-bad', 'Por vencer': 'b-warn', Pausada: 'b-neutral', Cancelada: 'b-neutral' }[e.est] || 'b-neutral';

function setAtt(sid,sesId,gid,v){ const ex=S.attendance.find(a=>a.estudianteId===sid&&a.sesionId===sesId);

function quickPay(pid){ const p=S.payments.find(x=>x.id===pid); modal(`<div class="stack"><div class="field"><label>Valor a abonar</label><input class="input" id="qp_v" inputmode="numeric" value="${p.saldo}"></div><div class="field"><label>Medio de pago</label><select class="select" id="qp_m">${METHODS.map(m=>`<option ${m===p.metodo?'selected':''}>${m}</option>`).join('')}</select></div><div class="field"><label>Comprobante</label><input class="input" id="qp_r" placeholder="REF-000000"></div></div>`,{title:'Registrar abono · '+p.concepto,footer:`<button class="btn btn-secondary" onclick="closeLayer()">Cancelar</button><button class="btn btn-primary" onclick="(function(){const p=S.payments.find(x=>x.id==='${pid}');const v=Math.min(p.saldo,Number($('#qp_v').value)||0);if(v<=0)return toast('El valor debe ser mayor a cero.','err');const s=studentOf(p.estudianteId);p.pagado+=v;p.saldo-=v;p.metodo=$('#qp_m').value;p.comprobante=$('#qp_r').value||'REC-'+rint(1000,9999);p.fechaPago=iso(TODAY);p.estado=p.saldo===0?'Pagado':'Pendiente';delete p.reporte;s.pagado+=v;s.saldo-=v;audit('Abono registrado','Pago','${pid}','',v);save();closeLayer();render();toast('Abono de '+fmt(v)+' registrado','ok')})()">Registrar</button>`}); }
function editPayment(pid){ const p=S.payments.find(x=>x.id===pid); modal(`<div class="stack"><div class="field"><label>Concepto</label><input class="input" id="ep_c" value="${esc(p.concepto)}"></div><div class="grid g2" style="gap:12px"><div class="field"><label>Valor programado</label><input class="input" id="ep_p" inputmode="numeric" value="${p.programado}"></div><div class="field"><label>Valor pagado</label><input class="input" id="ep_g" inputmode="numeric" value="${p.pagado}"></div><div class="field"><label>Vencimiento</label><input class="input" type="date" id="ep_v" value="${p.vencimiento}"></div><div class="field"><label>Medio</label><select class="select" id="ep_m">${METHODS.map(m=>`<option ${m===p.metodo?'selected':''}>${m}</option>`).join('')}</select></div></div></div>`,{title:'Editar pago',footer:`<button class="btn btn-danger" onclick="(function(){if(!confirm('¿Eliminar este pago?'))return;const p=S.payments.find(x=>x.id==='${pid}');const s=studentOf(p.estudianteId);s.pagado-=p.pagado;s.saldo-=p.saldo;S.payments.splice(S.payments.indexOf(p),1);audit('Pago eliminado','Pago','${pid}');save();closeLayer();render();toast('Pago eliminado','info')})()">Eliminar</button><button class="btn btn-primary" onclick="(function(){const p=S.payments.find(x=>x.id==='${pid}');const s=studentOf(p.estudianteId);s.pagado-=p.pagado;s.saldo-=p.saldo;p.concepto=$('#ep_c').value;p.programado=Number($('#ep_p').value)||0;p.pagado=Number($('#ep_g').value)||0;p.saldo=Math.max(0,p.programado-p.pagado);p.vencimiento=$('#ep_v').value;p.metodo=$('#ep_m').value;p.estado=p.saldo===0?'Pagado':(p.vencimiento<iso(TODAY)?'Vencido':'Pendiente');s.pagado+=p.pagado;s.saldo+=p.saldo;audit('Pago editado','Pago','${pid}');save();closeLayer();render();toast('Pago actualizado','ok')})()">Guardar</button>`}); }
function addPayment(sid){ const s=studentOf(sid); const c=courseOf(s.cursoId); modal(`<div class="stack"><div class="field"><label>Concepto</label><input class="input" id="ap_c" value="${c.pagoUnico?'Pago único':'Cuota adicional'}"></div><div class="grid g2" style="gap:12px"><div class="field"><label>Valor</label><input class="input" id="ap_v" inputmode="numeric" value="${c.precio}"></div><div class="field"><label>Vencimiento</label><input class="input" type="date" id="ap_f" value="${iso(TODAY)}"></div><div class="field"><label>Medio</label><select class="select" id="ap_m">${METHODS.map(m=>`<option>${m}</option>`).join('')}</select></div><div class="field"><label>¿Ya está pagado?</label><select class="select" id="ap_p"><option value="si">Sí, registrar como pagado</option><option value="no">No, queda pendiente</option></select></div></div></div>`,{title:'Agregar pago · '+s.nombre,footer:`<button class="btn btn-secondary" onclick="closeLayer()">Cancelar</button><button class="btn btn-primary" onclick="(function(){const s=studentOf('${sid}');const v=Number($('#ap_v').value)||0;if(v<=0)return toast('Ingresa un valor válido.','err');const pagado=$('#ap_p').value==='si';const id=s.id+'-X'+rint(100,999);S.payments.push({id,estudianteId:s.id,cursoId:s.cursoId,unidad:s.unidad,concepto:$('#ap_c').value,cuota:99,programado:v,pagado:pagado?v:0,saldo:pagado?0:v,vencimiento:$('#ap_f').value,fechaPago:pagado?iso(TODAY):null,metodo:$('#ap_m').value,estado:pagado?'Pagado':'Pendiente',asesorId:s.asesorId,comprobante:pagado?'REC-'+rint(1000,9999):''});s.precioFinal+=v;if(pagado)s.pagado+=v;else s.saldo+=v;audit('Pago agregado','Pago',id,'',v);save();closeLayer();render();toast('Pago agregado','ok')})()">Agregar</button>`}); }
function addStudentToGroup(gid){ const g=groupOf(gid); const c=courseOf(g.cursoId); modal(`<div class="stack"><div class="grid g2" style="gap:12px"><div class="field"><label>Nombre completo</label><input class="input" id="as_n"></div><div class="field"><label>WhatsApp</label><input class="input" id="as_t" inputmode="tel"></div><div class="field"><label>Documento</label><input class="input" id="as_d" inputmode="numeric"></div><div class="field"><label>Ciudad</label><input class="input" id="as_c" value="Ibagué"></div><div class="field"><label>Valor a cobrar</label><input class="input" id="as_v" inputmode="numeric" value="${c.precio}"></div><div class="field"><label>Origen</label><select class="select" id="as_o">${SOURCES.map(s=>`<option>${s}</option>`).join('')}</select></div></div><label class="check"><input type="checkbox" id="as_p" checked><span class="small">Registrar el <b>pago como recibido</b> ahora</span></label></div>`,{title:'Inscribir en '+g.nombre,footer:`<button class="btn btn-secondary" onclick="closeLayer()">Cancelar</button><button class="btn btn-primary" onclick="(function(){const n=$('#as_n').value.trim(),t=phone($('#as_t').value);if(n.length<4||t.length!==10)return toast('Nombre y WhatsApp de 10 dígitos son obligatorios.','err');const v=Number($('#as_v').value)||0;const pag=$('#as_p').checked;const id='E'+String(S.students.length+1).padStart(3,'0');const c=courseOf('${g.cursoId}');S.students.push({id,nombre:n,documento:$('#as_d').value,telefono:t,correo:'',edad:null,ocupacion:'',ciudad:$('#as_c').value,departamento:'Tolima',cursoId:'${g.cursoId}',grupoId:'${gid}',fechaMatricula:iso(TODAY),precio:v,descuento:0,precioFinal:v,pagado:pag?v:0,saldo:pag?0:v,cuotas:1,metodoPago:'Nequi',estado:'Matriculado',fuente:$('#as_o').value,asesorId:me().ref||'A1',unidad:c.unidad,obs:'Inscrito por comercial'});S.payments.push({id:id+'-Q1',estudianteId:id,cursoId:'${g.cursoId}',unidad:c.unidad,concepto:c.pagoUnico?'Pago único':'Cuota 1',cuota:1,programado:v,pagado:pag?v:0,saldo:pag?0:v,vencimiento:iso(TODAY),fechaPago:pag?iso(TODAY):null,metodo:'Nequi',estado:pag?'Pagado':'Pendiente',asesorId:me().ref||'A1',comprobante:pag?'REC-'+rint(1000,9999):''});audit('Estudiante inscrito','Estudiante',id);save();closeLayer();render();toast('Estudiante inscrito','ok')})()">Inscribir</button>`}); }
function acadCertificados(g,studs,c){
  return `<div class="card"><div class="card-hd"><h4>Certificados del grupo</h4><span class="caption">Se generan con la plantilla oficial y quedan <b>guardados</b></span></div><div class="tbl-wrap"><table class="tbl cards"><thead><tr><th>Estudiante</th><th>Asistencia</th><th>Fallas</th><th class="money">Saldo</th><th>Requisitos</th><th>Certificado</th><th>Acciones</th></tr></thead><tbody>${studs.map(st=>{const a=attendancePct(st.id); const faltas=S.attendance.filter(x=>x.estudianteId===st.id&&x.estado==='No asistió').length; const ok=(a===null||a>=S.config.asistenciaMin)&&st.saldo===0&&faltas<3; const cert=(S.certs||{})[st.id];
    return `<tr><td data-l="Estudiante"><b>${esc(st.nombre)}</b><div class="caption">${st.documento||'sin documento'}</div></td><td data-l="Asistencia" class="num">${a===null?'—':a+' %'}</td><td data-l="Fallas">${badge(faltas+'',faltas>=3?'b-bad':'b-ok')}</td><td data-l="Saldo" class="money num">${fmt(st.saldo)}</td><td data-l="Requisitos">${badge(ok?'Cumple':'No cumple',ok?'b-ok':'b-warn')}</td><td data-l="Certificado">${cert?`${badge('Emitido','b-ok')}<div class="caption">${cert.codigo} · ${fdate(cert.fecha)}</div>`:'<span class="caption">Sin emitir</span>'}</td><td data-l="Acciones"><div class="row" style="gap:4px;flex-wrap:nowrap">${cert?`<button class="btn btn-secondary btn-xs" onclick="verCert('${st.id}')">${I.eye} Ver</button><button class="btn btn-secondary btn-xs" onclick="descargarCert('${st.id}')">${I.download}</button>`:`<button class="btn btn-primary btn-xs" ${ok?'':'disabled title="No cumple requisitos"'} onclick="emitirCert('${st.id}')">Generar</button>`}<button class="btn btn-secondary btn-xs" onclick="subirCert('${st.id}')">${I.upload} Adjuntar</button></div></td></tr>`}).join('')}</tbody></table></div><div class="note-box" style="margin-top:14px">🏅 El sistema <b>rellena la plantilla oficial</b> con el nombre, el curso, las horas, la fecha y el <b>código verificable</b>. Puedes <b>descargarlo</b> con un clic o <b>adjuntar</b> un archivo propio.</div></div>`;
}
function certData(sid){ const st=studentOf(sid); const c=courseOf(st.cursoId); const g=groupOf(st.grupoId); const saved=(S.certs||{})[sid];
  return { nombre:st.nombre, curso:c.nombre, horas:c.horas, fecha:saved?saved.fecha:(g?g.fin:iso(TODAY)), codigo:saved?saved.codigo:('PF-'+TODAY.getFullYear()+'-'+st.id), doc:st.documento||'' }; }
function emitirCert(sid){ const d=certData(sid); S.certs=S.certs||{}; S.certs[sid]={codigo:d.codigo,fecha:iso(TODAY),emitidoPor:me().nombre,tipo:'generado'};
  const st=studentOf(sid); if(st.estado!=='Certificado'){ st.estado='Certificado'; } audit('Certificado emitido','Estudiante',sid,'',d.codigo); save(); render(); verCert(sid); toast('Certificado generado y guardado','ok'); }
function certHTML(d){ return `<div class="cert-gen" id="certgen"><img src="${CERT_IMG}" alt="Certificado"><span class="cg-nombre">${esc(d.nombre)}</span><span class="cg-curso">${esc(d.curso)}</span><span class="cg-meta">${d.horas} horas · Ibagué, Tolima · ${fdate(d.fecha)}</span><span class="cg-codigo">Código de verificación: ${esc(d.codigo)}</span><span class="cg-url">Verifica este certificado en publifuturo.com/verificar</span></div>`; }
function verCert(sid){ const d=certData(sid); modal(certHTML(d)+`<p class="caption" style="margin-top:12px;text-align:center">Verificable en <b>publifuturo.com/verificar</b> con el código <b>${esc(d.codigo)}</b></p>`,{title:'Certificado de '+d.nombre.split(' ')[0],w:900,footer:`<button class="btn btn-secondary" onclick="printEl('#certgen')">${I.download} Descargar / Imprimir</button><a class="btn btn-wa" href="${waLink(studentOf(sid).telefono,'¡Felicitaciones *'+studentOf(sid).nombre.split(' ')[0]+'*! 🎉🏅\\n\\nYa está listo tu *certificado* del curso *'+d.curso+'*.\\n\\n🔎 Código de verificación: *'+d.codigo+'*\\n\\n¡Gracias por formarte con *PubliFuturo*! 🚀')}" target="_blank" rel="noopener">${I.wa} Enviar</a>`}); }
function descargarCert(sid){ verCert(sid); setTimeout(()=>printEl('#certgen'),400); }
function subirCert(sid){ const st=studentOf(sid); modal(`<p class="small muted">Adjunta el <b>PDF o imagen</b> del certificado de <b>${esc(st.nombre)}</b>. Queda guardado en su ficha.</p><div class="drop" onclick="$('#cf').click()">${I.upload}<div style="margin-top:6px"><b>Selecciona el archivo</b></div><div class="caption">PDF, JPG o PNG</div><input type="file" id="cf" accept=".pdf,.jpg,.jpeg,.png" style="display:none" onchange="(function(f){if(!f)return;S.certs=S.certs||{};S.certs['${sid}']={codigo:'PF-'+TODAY.getFullYear()+'-${sid}',fecha:iso(TODAY),emitidoPor:me().nombre,tipo:'adjunto',archivo:f.name};audit('Certificado adjuntado','Estudiante','${sid}','',f.name);save();closeLayer();render();toast('Certificado adjuntado: '+f.name,'ok')})(this.files[0])"></div>`,{title:'Adjuntar certificado'}); }

function AdmClients() { const map = {}; const add = (k, n, tel, ciudad, u, v, p) => { const c = map[k] = map[k] || { id: k, nombre: n, telefono: tel, ciudad, compras: 0, unidades: new Set(), total: 0, pagado: 0, ultima: '' }; c.compras++; c.unidades.add(u); c.total += v; c.pagado += p; }; S.students.forEach(s => add(s.telefono, s.nombre, s.telefono, s.ciudad, s.unidad, s.precioFinal, s.pagado)); S.microapps.forEach(m => add(m.telefono, m.empresa, m.telefono, m.ciudad, 'microapps', m.precio, m.pagado)); S.videos.forEach(v => add(v.telefono, v.empresa, v.telefono, 'Ibagué', 'videos-ia', v.precio, v.pagado)); S.streaming.forEach(s => add(s.telefono, s.cliente, s.telefono, 'Ibagué', 'streaming', s.precio, s.pagado)); S.wholesale.forEach(w => add(w.telefono, w.negocio, w.telefono, w.ciudad, 'accesorios-mayor', w.total, w.pagado)); const rows = Object.values(map).map(c => ({ ...c, unidades: [...c.unidades].map(unitName).join(', '), saldo: c.total - c.pagado, siguiente: c.unidades.has('semilleros') && !c.unidades.has('crecimiento-digital') ? 'Crecimiento Digital' : c.unidades.has('crecimiento-digital') && !c.unidades.has('master-digital-360') ? 'Máster Digital 360' : c.unidades.has('microapps') ? 'Videos con IA' : 'Plan de acompañamiento' }));
  return ph('Clientes', `${rows.length} clientes únicos con historial cruzado entre unidades y siguiente producto recomendado.`) + `<div class="kpis">${stat('Clientes', rows.length)}${stat('Valor de vida promedio', fmt(sum(rows, 'total') / rows.length))}${stat('Con más de una unidad', rows.filter(r => r.unidades.includes(',')).length)}${stat('Cartera total', fmt(sum(rows, 'saldo')))}</div>` + table('clients', rows, [{ k: 'nombre', l: 'Cliente', clip: true }, { k: 'telefono', l: 'WhatsApp' }, { k: 'ciudad', l: 'Ciudad' }, { k: 'compras', l: 'Compras' }, { k: 'unidades', l: 'Unidades', clip: true }, { k: 'total', l: 'Valor de vida', money: true, v: r => fmt(r.total) }, { k: 'saldo', l: 'Saldo', money: true, v: r => fmt(r.saldo) }, { k: 'siguiente', l: 'Recomendar', r: r => badge(r.siguiente, 'b-violet') }], { row: r => `<a class="btn btn-wa btn-xs" href="${waLink(r.telefono, 'Hola ' + r.nombre.split(' ')[0] + ', te escribimos de PubliFuturo. Tenemos algo pensado para ti: ' + r.siguiente + '.')}" target="_blank" rel="noopener">${I.wa}</a>` }); }
let alertF = '';
function AdmAlerts(list) { const all = computeAlerts(); const l = alertF ? all.filter(a => a.prioridad === alertF) : all; const cnt = groupBy(all, 'prioridad'); return ph('Centro de alertas', `${all.length} alertas generadas por el motor de reglas a partir de pagos, asistencia, leads, proyectos, órdenes, inventario y suscripciones.`) + `<div class="row" style="margin-bottom:16px"><div class="tabs"><button class="${!alertF ? 'on' : ''}" onclick="alertF='';render()">Todas · ${all.length}</button>${[['critico', 'Crítico'], ['urgente', 'Urgente'], ['academico', 'Académico'], ['proximo', 'Próximo'], ['ok', 'Al día']].map(([k, n]) => `<button class="${alertF === k ? 'on' : ''}" onclick="alertF='${k}';render()">${n} · ${(cnt[k] || []).length}</button>`).join('')}</div></div><div class="card" style="padding:0">${l.length ? l.map(AlertItem).join('') : empty('Sin alertas', 'Todo está al día en esta categoría.')}</div>`; }

function FinanceView(r) { const sub = r.seg[1] || ''; const v = { '': FinHome, cobrar: FinReceivables, movimientos: FinMovements, resultados: FinPL, flujo: FinCashflow, comisiones: FinCommissions, esal: FinESAL, mensualidades: () => Mensualidades() }[sub]; return v ? v(r) : NotFound(); }
const monthSum = (list, k) => sum(list.filter(x => x.fecha && monthKey(x.fecha) === k), 'valor');
function FinHome() { const inc = incomes(), exp = S.expenses; const k0 = last6[5].k, k1 = last6[4].k; const i0 = monthSum(inc, k0), i1 = monthSum(inc, k1), e0 = monthSum(exp, k0), e1 = monthSum(exp, k1); const rec = receivables(); const d = (a, b) => b ? Math.round((a - b) / b * 100) : 0; const caja = sum(inc, 'valor') - sum(exp, 'valor'); const byM = last6.map(m => ({ i: monthSum(inc, m.k), e: monthSum(exp, m.k) })); const byMethod = groupBy(inc.filter(i => inPeriod(i.fecha)), 'metodo');
  return ph('Panel financiero', 'Tesorería de la fundación: ingresos, egresos, cartera y caja.') + `<div class="kpis">${stat('Ingresos del mes', fmt(i0), d(i0, i1), byM.map(x => x.i))}${stat('Egresos del mes', fmt(e0), d(e0, e1), byM.map(x => x.e))}${stat('Utilidad neta', fmt(i0 - e0), d(i0 - e0, i1 - e1))}${stat('Cartera por cobrar', fmt(sum(rec, 'saldo')))}${stat('Cartera vencida', fmt(sum(rec.filter(x => x.mora > 0), 'saldo')))}${stat('Disponible en caja', fmt(caja))}</div><div class="grid g2"><div class="card"><h4>Ingresos vs. egresos</h4>${barChart(last6.map(m => m.l), [{ n: 'Ingresos', v: byM.map(x => x.i), c: 'var(--brand-600)' }, { n: 'Egresos', v: byM.map(x => x.e), c: 'var(--danger)' }])}</div><div class="card"><h4>Conciliación por medio de pago</h4>${donut(Object.entries(byMethod).map(([n, l]) => ({ n, v: sum(l, 'valor') })), { center: short(sum(inc.filter(i => inPeriod(i.fecha)), 'valor')) })}</div><div class="card"><h4>Ingresos por unidad</h4>${barChart(UNITS.map(u => u.n.split(' ')[0]), [{ n: 'Ventas', v: UNITS.map(u => unitSales(u.slug)) }])}</div><div class="card"><div class="card-hd"><h4>Mayores deudores</h4><a href="#/cartera/cobrar" class="small">Ver cartera</a></div>${rec.sort((a, b) => b.saldo - a.saldo).slice(0, 6).map(x => `<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--border)"><div><b class="small">${esc(x.deudor)}</b><div class="caption">${unitName(x.unidad)} · ${x.mora ? x.mora + ' días de mora' : 'al día'}</div></div><b class="num small" style="color:${x.mora > 30 ? 'var(--danger)' : 'inherit'}">${fmt(x.saldo)}</b></div>`).join('')}</div></div>`; }
function FinReceivables() { const rec = receivables(); const buckets = [['Corriente', x => x.mora === 0], ['1–30', x => x.mora >= 1 && x.mora <= 30], ['31–60', x => x.mora > 30 && x.mora <= 60], ['61–90', x => x.mora > 60 && x.mora <= 90], ['+90', x => x.mora > 90]]; const risk = x => x.mora > 60 ? 'Alto' : x.mora > 15 ? 'Medio' : 'Bajo'; const rows = rec.map(x => ({ ...x, riesgo: risk(x), unidadN: unitName(x.unidad) }));
  return ph('Cartera por cobrar', `${rec.length} saldos pendientes · ${fmt(sum(rec, 'saldo'))} en total.`) + `<div class="aging" style="margin-bottom:20px">${buckets.map(([l, f]) => { const s = rec.filter(f); return `<div><b class="num">${fmt(sum(s, 'saldo'))}</b><span>${l} · ${s.length}</span></div>`; }).join('')}</div><div class="card" style="margin-bottom:20px"><h4>Aging</h4>${barChart(buckets.map(b => b[0]), [{ n: 'Saldo', v: buckets.map(([, f]) => sum(rec.filter(f), 'saldo')), c: 'var(--warning)' }])}</div>` + table('recv', rows, [{ k: 'deudor', l: 'Deudor', clip: true }, { k: 'unidadN', l: 'Unidad' }, { k: 'concepto', l: 'Concepto' }, { k: 'total', l: 'Total', money: true, v: x => fmt(x.total) }, { k: 'pagado', l: 'Pagado', money: true, v: x => fmt(x.pagado) }, { k: 'saldo', l: 'Saldo', money: true, v: x => fmt(x.saldo) }, { k: 'vence', l: 'Vence', v: x => fdate(x.vence) }, { k: 'mora', l: 'Mora', r: x => x.mora ? badge(x.mora + ' d', x.mora > 30 ? 'b-bad' : 'b-warn') : badge('Al día', 'b-ok') }, { k: 'riesgo', l: 'Riesgo', r: x => badge(x.riesgo, x.riesgo === 'Alto' ? 'b-bad' : x.riesgo === 'Medio' ? 'b-warn' : 'b-ok') }], { filters: [{ k: 'unidadN', l: 'Unidad' }, { k: 'riesgo', l: 'Riesgo' }], row: x => `<div class="row" style="gap:4px;flex-wrap:nowrap"><a class="btn btn-wa btn-xs" href="${waLink(x.telefono, tpl('pago', { nombre: x.deudor.split(' ')[0], valor: fmt(x.saldo), fecha: fdate(x.vence) }))}" target="_blank" rel="noopener" title="Recordatorio">${I.wa}</a>${x.ref ? `<button class="btn btn-secondary btn-xs" onclick="registerPayment('${x.ref.estudianteId}')">Abono</button><button class="btn btn-secondary btn-xs" onclick="paymentPlan('${x.ref.id}')">Acuerdo</button>` : `<button class="btn btn-secondary btn-xs" onclick="toast('Registra el pago desde la unidad correspondiente','info')">Abono</button>`}${session().role === 'superadmin' ? `<button class="btn btn-secondary btn-xs" onclick="confirmDialog('Marcar como incobrable','Esta acción se registra en auditoría y retira el saldo de la cartera.',function(){toast('Marcado como incobrable (demo)','info')},true)">Incobrable</button>` : ''}</div>` }); }
function paymentPlan(pid) { const p = S.payments.find(x => x.id === pid); const s = studentOf(p.estudianteId); modal(`<p class="small muted">Divide el saldo de <b>${fmt(p.saldo)}</b> de ${esc(s.nombre)} en nuevas cuotas.</p><div class="grid g2" style="gap:12px"><div class="field"><label>Número de cuotas</label><select class="select" id="pp_n">${[2, 3, 4].map(n => `<option>${n}</option>`).join('')}</select></div><div class="field"><label>Primera fecha</label><input class="input" type="date" id="pp_d" value="${iso(addDays(TODAY, 7))}"></div></div>`, { title: 'Acuerdo de pago', footer: `<button class="btn btn-secondary" onclick="closeLayer()">Cancelar</button><button class="btn btn-primary" onclick="(function(){const p=S.payments.find(x=>x.id==='${pid}');const n=Number($('#pp_n').value);const d0=new Date($('#pp_d').value+'T12:00:00');const v=Math.round(p.saldo/n);const base=p.id.split('-Q')[0];for(let i=0;i<n;i++){S.payments.push({...p,id:base+'-A'+(i+1),concepto:'Acuerdo '+(i+1)+'/'+n,cuota:90+i,programado:v,pagado:0,saldo:v,vencimiento:iso(addDays(d0,i*15)),fechaPago:null,estado:'Acuerdo de pago',comprobante:''})}p.saldo=0;p.estado='Acuerdo de pago';p.programado=p.pagado;audit('Acuerdo de pago','Pago','${pid}','',n+' cuotas');save();closeLayer();render();toast('Acuerdo creado en '+n+' cuotas','ok')})()">Crear acuerdo</button>` }); }

function FinCashflow() { const caja0 = sum(incomes(), 'valor') - sum(S.expenses, 'valor'); const weeks = Array.from({ length: 13 }, (_, i) => ({ l: 'S' + (i + 1), a: iso(addDays(TODAY, i * 7)), b: iso(addDays(TODAY, i * 7 + 6)) })); const inW = w => sum(S.payments.filter(p => p.saldo > 0 && p.vencimiento >= w.a && p.vencimiento <= w.b), 'saldo') + sum(S.streaming.filter(s => s.corte >= w.a && s.corte <= w.b), 'precio') * .7; const outW = w => 650000 + sum(S.microapps.filter(m => m.renovDominio >= w.a && m.renovDominio <= w.b), () => 60000) + (Number(w.l.slice(1)) % 4 === 0 ? 2200000 : 0); let bal = caja0; const proj = weeks.map(w => { bal += inW(w) - outW(w); return bal; }); const below = proj.findIndex(v => v < S.config.saldoMinimo);

lass="caption">${st.length} matriculados</div></div><div style="text-align:right"><b class="num small" style="color:${ing - cost >= 0 ? 'var(--success)' : 'var(--danger)'}">${fmt(ing - cost)}</b><div class="caption">${ing ? Math.round((ing - cost) / ing * 100) : 0} % margen</div></div></div>`; }).join('')}</div><div class="card"><div class="card-hd"><h4>Alertas críticas y urgentes</h4><a class="small" href="#/admin/alertas">Centro de alertas</a></div>${alerts.filter(a => ['critico', 'urgente'].includes(a.prioridad)).slice(0, 7).map(a => `<div class="alert-it" style="padding:8px 0"><span class="pr pr-${a.prioridad}"></span><div><b class="small">${esc(a.tipo)}</b> <span class="caption">· ${unitName(a.unidad)}</span><div class="caption">${esc(a.mensaje)}</div></div></div>`).join('')}</div></div>`; }
function SupCourses() { const rows = COURSES.map(c => { const gs = GROUPS.filter(g => g.cursoId === c.id); const st = S.students.filter(s => s.cursoId === c.id); const ing = sum(st, 'precioFinal'); const cost = sum(st, () => c.costo) + Math.round(ing * (S.config.comAsesor + S.config.comDocente) / 100) + sum(S.expenses.filter(e => e.unidad === c.unidad), 'valor'); return { id: c.id, curso: c.nombre, grupos: gs.filter(g => !g.estado.startsWith('Fin')).length, matriculados: st.length, ocupacion: Math.round(100 * st.length / Math.max(1, sum(gs, 'cupo'))), ingreso: ing, recaudo: sum(st, 'pagado'), costo: cost, utilidad: ing - cost, margen: ing ? Math.round((ing - cost) / ing * 100) : 0, precio: c.precio }; }); return ph('Cursos activos y rentabilidad', 'Ingreso, costo y utilidad por programa, con grupos abiertos y ocupación.') + `<div class="kpis">${stat('Programas', COURSES.length)}${stat('Ingreso total', fmt(sum(rows, 'ingreso')))}${stat('Utilidad total', fmt(sum(rows, 'utilidad')))}${stat('Margen promedio', Math.round(sum(rows, 'margen') / rows.length) + ' %')}</div>` + table('sup_courses', rows, [{ k: 'curso', l: 'Curso' }, { k: 'precio', l: 'Precio', money: true, v: r => fmt(r.precio) }, { k: 'grupos', l: 'Grupos abiertos' }, { k: 'matriculados', l: 'Matriculados' }, { k: 'ocupacion', l: 'Ocupación', r: r => bar(r.ocupacion, r.ocupacion > 80 ? 'ok' : '') + `<span class="caption">${r.ocupacion} %</span>` }, { k: 'ingreso', l: 'Ingreso', money: true, v: r => fmt(r.ingreso) }, { k: 'recaudo', l: 'Recaudado', money: true, v: r => fmt(r.recaudo) }, { k: 'costo', l: 'Costo', money: true, v: r => fmt(r.costo) }, { k: 'utilidad', l: 'Utilidad', money: true, v: r => fmt(r.utilidad) }, { k: 'margen', l: 'Margen', r: r => badge(r.margen + ' %', r.margen >= 30 ? 'b-ok' : r.margen >= 10 ? 'b-warn' : 'b-bad') }], { size: 10 }) + `<div class="card" style="margin-top:20px"><h4>Grupos y cohortes</h4><div class="tbl-wrap"><table class="tbl cards"><thead><tr><th>Grupo</th><th>Inicio</th><th>Docente</th><th>Cupos</th><th>Estado</th></tr></thead><tbody>${GROUPS.map(g => { const n = groupStudents(g.id).length; return `<tr><td data-l="Grupo">${g.nombre}</td><td data-l="Inicio">${fdate(g.inicio)}</td><td data-l="Docente">${teacherOf(g.docenteId).nombre}</td><td data-l="Cupos">${n}/${g.cupo} ${bar(n / g.cupo * 100)}</td><td data-l="Estado">${sBadge(g.estado)}</td></tr>`; }).join('')}</tbody></table></div></div>`; }
function SupStudents(r) { if (r.q.q && !TBL.sup_students) { TBL.sup_students = { q: r.q.q, sort: null, dir: 1, page: 1, size: 12, f: {} }; } const rows = S.students.map(s => ({ ...s, curso: courseOf(s.cursoId).nombre, asistencia: attendancePct(s.id), avance: progressPct(s.id) })); return ph('Estudiantes', `${rows.length} estudiantes en todas las unidades académicas. Haz clic para abrir la ficha 360.`) + table('sup_students', rows, [{ k: 'nombre', l: 'Estudiante', clip: true }, { k: 'curso', l: 'Curso', clip: true }, { k: 'ciudad', l: 'Ciudad' }, { k: 'estado', l: 'Estado', r: s => sBadge(s.estado) }, { k: 'asistencia', l: 'Asistencia', v: s => s.asistencia === null ? '—' : s.asistencia + ' %' }, { k: 'avance', l: 'Avance', v: s => s.avance + ' %' }, { k: 'precioFinal', l: 'Valor', money: true, v: s => fmt(s.precioFinal) }, { k: 'saldo', l: 'Saldo', money: true, v: s => fmt(s.saldo) }, { k: 'fuente', l: 'Origen' }], { onRow: 'openStudent', filters: [{ k: 'curso', l: 'Curso' }, { k: 'estado', l: 'Estado' }, { k: 'departamento', l: 'Departamento' }], size: 12 }); }
function SupAttendance() { const gs = GROUPS.filter(g => S.attendance.some(a => a.grupoId === g.id)); const risk = S.students.filter(st => S.attendance.filter(a => a.estudianteId === st.id && a.estado === 'No asistió').length >= 3); return ph('Asistencia global', 'Matriz grupo × clase. Se marca <b>riesgo de deserción</b> a partir de <b>3 inasistencias</b>. 🟢 a tiempo · 🟡 tarde/justificada · 🔴 no asistió.') + `<div class="kpis">${stat('Grupos con registros', gs.length)}${stat('Asistencia global', Math.round(100 * S.attendance.filter(a => a.estado !== 'No asistió').length / Math.max(1, S.attendance.length)) + ' %')}${stat('En riesgo de deserción', risk.length)}</div>${gs.map(g => { const ses = S.sessions.filter(x => x.grupoId === g.id && x.estado === 'Realizada'); const studs = groupStudents(g.id); return `<div class="card" style="margin-bottom:16px"><div class="card-hd"><h4>${g.nombre}</h4><span class="caption">${studs.length} estudiantes · ${ses.length} clases</span></div><div class="tbl-wrap"><table class="tbl" style="min-width:0"><thead><tr><th>Estudiante</th>${ses.map(x => `<th>C${x.n}</th>`).join('')}<th>%</th></tr></thead><tbody>${studs.map(st => { const p = attendancePct(st.id); return `<tr><td class="clip">${esc(st.nombre)}</td>${ses.map(x => { const a = S.attendance.find(y => y.estudianteId === st.id && y.sesionId === x.id); return `<td><i style="display:inline-block;width:14px;height:14px;border-radius:4px;background:${!a ? 'var(--border)' : a.estado === 'Asistió' ? 'var(--success)' : a.estado === 'No asistió' ? 'var(--danger)' : 'var(--warning)'}" title="${a?.estado || '—'}"></i></td>`; }).join('')}<td>${p === null ? '—' : badge(p + ' %', p >= S.config.asistenciaMin ? 'b-ok' : 'b-bad')}</td></tr>`; }).join('')}</tbody></table></div></div>`; }).join('')}${risk.length ? `<div class="card" style="border-color:var(--danger)"><h4>Riesgo de deserción</h4>${risk.map(st => `<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--border)"><span class="small"><b>${esc(st.nombre)}</b> · ${courseOf(st.cursoId).nombre}</span><a class="btn btn-wa btn-xs" href="${waLink(st.telefono, 'Hola ' + st.nombre.split(' ')[0] + ', te extrañamos en clase. ¿Cómo podemos ayudarte?')}" target="_blank" rel="noopener">${I.wa} Contactar</a></div>`).join('')}</div>` : ''}`; }
function SupUsers() { return ph('Usuarios y roles', 'Crea usuarios, asigna rol y unidades de negocio, activa o desactiva accesos.', `<button class="btn btn-primary btn-sm" onclick="newUser()">${I.plus} Nuevo usuario</button>`) + `<div class="card" style="padding:0">${S.users.map(u => `<div class="row between" style="padding:14px 18px;border-bottom:1px solid var(--border);gap:12px"><div class="row" style="gap:12px;min-width:0">${avatar(u.nombre, '', 'v')}<div style="min-width:0"><b class="small">${esc(u.nombre)}</b><div class="caption">${u.correo} · ${ROLE_LABEL[u.role]}</div>${u.units ? `<div class="caption">${u.units.length} de ${UNITS.length} unidades asignadas</div>` : ''}</div></div><div class="row" style="gap:6px">${u.role === 'admin' ? `<button class="btn btn-secondary btn-xs" onclick="editUnits('${u.id}')">Unidades</button>` : ''}<button class="btn btn-secondary btn-xs" onclick="toast('Enlace de restablecimiento enviado a ${u.correo}','ok')">Reiniciar acceso</button><button class="switch ${u.activo ? 'on' : ''}" onclick="const u=S.users.find(x=>x.id==='${u.id}');u.activo=!u.activo;audit('Usuario '+(u.activo?'activado':'desactivado'),'Usuario','${u.id}');save();render()" aria-label="Activo"></button></div></div>`).join('')}</div>`; }
function editUnits(id) { const u = S.users.find(x => x.id === id); modal(`<div class="stack" style="gap:8px">${UNITS.map(x => `<label class="check"><input type="checkbox" value="${x.slug}" ${u.units.includes(x.slug) ? 'checked' : ''}><span>${x.n}</span></label>`).join('')}</div>`, { title: 'Unidades asignadas · ' + u.nombre, footer: `<button class="btn btn-secondary" onclick="closeLayer()">Cancelar</button><button class="btn btn-primary" onclick="(function(){const u=S.users.find(x=>x.id==='${id}');u.units=$$('#layer input:checked').map(i=>i.value);audit('Unidades asignadas','Usuario','${id}','',u.units.length);save();closeLayer();render();toast('Permisos actualizados','ok')})()">Guardar</button>` }); }
function newUser() { modal(`<div class="stack"><div class="field"><label>Nombre</label><input class="input" id="nu_n"></div><div class="field"><label>Correo</label><input class="input" id="nu_c" inputmode="email"></div><div class="field"><label>Rol</label><select class="select" id="nu_r">${Object.entries(ROLE_LABEL).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select></div></div>`, { title: 'Nuevo usuario', footer: `<button class="btn btn-secondary" onclick="closeLayer()">Cancelar</button><button class="btn btn-primary" onclick="(function(){const n=$('#nu_n').value.trim(),c=$('#nu_c').value.trim();if(!n||!c.includes('@'))return toast('Nombre y correo válido son obligatorios.','err');const r=$('#nu_r').value;S.users.push({id:'U'+(S.users.length+1),role:r,nombre:n,sub:ROLE_LABEL[r],ref:'',correo:c,activo:true,units:r==='admin'?[]:undefined});audit('Usuario creado','Usuario',n);save();closeLayer();render();toast('Usuario creado','ok')})()">Crear</button>` }); }
function SupConfig() { const c = S.config; return ph('Configuración institucional', 'Parámetros que alimentan certificaciones, comisiones, alertas y plantillas.') + `<div class="grid g2"><div class="card"><h4>Parámetros</h4><div class="stack">${[['asistenciaMin', 'Asistencia mínima para certificar (%)'], ['comAsesor', 'Comisión asesor (%)'], ['comDocente', 'Comisión docente (%)'], ['cupo', 'Cupo por defecto'], ['anio', 'Año contable'], ['saldoMinimo', 'Saldo mínimo de seguridad (COP)']].map(([k, l]) => `<div class="field"><label>${l}</label><input class="input num" type="number" value="${c[k]}" onchange="const o=S.config['${k}'];S.config['${k}']=Number(this.value);audit('Configuración','${k}','',o,this.value);save();toast('Guardado','ok')"></div>`).join('')}</div></div><div class="card"><h4>Plantillas de WhatsApp</h4><p class="caption">Variables: {nombre} {valor} {fecha} {curso} {hora} {link} {servicio} {asesor} {interes} {equipo}</p><div class="stack">${Object.entries(c.plantillas).map(([k, v]) => `<div class="field"><label>${{ pago: 'Recordatorio de pago', clase: 'Aviso de clase', renov: 'Renovación de suscripción', lead: 'Seguimiento de lead', entrega: 'Entrega de equipo' }[k]}</label><textarea class="textarea" style="min-height:70px" onchange="S.config.plantillas['${k}']=this.value;audit('Plantilla','${k}');save();toast('Plantilla guardada','ok')">${esc(v)}</textarea></div>`).join('')}</div></div><div class="card"><h4>Datos de la fundación</h4><table class="mini-t"><tr><td class="muted">Nombre</td><td>${COPY.legal.nombre}</td></tr><tr><td class="muted">Naturaleza</td><td>${COPY.legal.tipo}</td></tr><tr><td class="muted">Domicilio</td><td>${COPY.legal.domicilio}</td></tr><tr><td class="muted">WhatsApp</td><td>${COPY.contacto.whatsapp}</td></tr><tr><td class="muted">Correo</td><td>${COPY.contacto.correo}</td></tr></table><p class="caption" style="margin-top:8px">Se editan en el código: sección [S06] → COPY.</p></div><div class="card"><h4>Sincronización entre dispositivos</h4>${CLOUD_ON ? `<div class="row" style="gap:8px;margin-bottom:10px">${SyncBadge()}</div><p class="small muted">Conectado a Supabase. Todos los dispositivos que abran este enlace comparten los mismos datos en tiempo real.</p><button class="btn btn-secondary btn-sm" onclick="navigator.clipboard.writeText(location.href.split('#')[0]).then(()=>toast('Enlace copiado','ok'))">${I.clip} Copiar enlace para compartir</button>` : `<p class="small muted">Ahora mismo los datos se guardan solo en este navegador. Para compartirlos entre dispositivos, crea un proyecto gratuito en Supabase y pega la URL y la llave "anon public" en el código (sección [S07], constantes <code>SUPABASE_URL</code> y <code>SUPABASE_ANON_KEY</code>).</p><a class="btn btn-secondary btn-sm" href="https://supabase.com" target="_blank" rel="noopener">Ir a supabase.com</a>`}</div><div class="card"><h4>Datos de la plataforma</h4><p class="small muted">La plataforma arranca <b>vacía</b> para que registres información real. Aquí puedes vaciarla de nuevo o cargar datos de ejemplo para explorar.</p><div class="stack" style="gap:10px"><div class="row between" style="padding:8px 0;border-bottom:1px solid var(--border)"><span class="small">Registros actuales</span><b class="num small">${S.students.length + S.leads.length + S.videos.length + S.microapps.length + S.streaming.length + S.wholesale.length + S.accSales.length}</b></div><button class="btn btn-secondary btn-sm" onclick="confirmDialog('Cargar datos de demostración','Se reemplazará TODO lo que tengas registrado por datos de ejemplo. Úsalo solo para explorar la plataforma.',cargarDemo)">${I.eye} Cargar datos de demostración</button><button class="btn btn-danger btn-sm" onclick="confirmDialog('Vaciar la plataforma','Se borrarán estudiantes, pagos, asistencia, prospectos, proyectos, cuentas y movimientos. Esta acción afecta a TODOS los dispositivos y no se puede deshacer.',resetData,true)">Vaciar todos los datos</button></div><p class="caption" style="margin-top:10px">Se conservan siempre: cursos, grupos, perfiles, docentes, plantillas de WhatsApp y configuración.</p></div></div>`; }
function SupAudit() { return ph('Auditoría', `${S.audit.length} acciones registradas: usuario, acción, entidad, valor anterior y nuevo.`) + table('audit', S.audit.map((a, i) => ({ ...a, i })), [{ k: 'fecha', l: 'Fecha' }, { k: 'usuario', l: 'Usuario' }, { k: 'accion', l: 'Acción' }, { k: 'entidad', l: 'Entidad' }, { k: 'id', l: 'Referencia', clip: true }, { k: 'antes', l: 'Antes', clip: true }, { k: 'despues', l: 'Después', clip: true }], { filters: [{ k: 'usuario', l: 'Usuario' }, { k: 'entidad', l: 'Entidad' }], size: 15, idKey: 'i' }); }
function SupReports() { const reps = [['Comercial', 'Leads, embudo, ventas por unidad y asesor', 'leads'], ['Académico', 'Estudiantes, asistencia, avance y certificación', 'sup_students'], ['Financiero', 'Ingresos, egresos, cartera y P&L', 'tx'], ['Cartera', 'Saldos por deudor con aging y riesgo', 'recv'], ['Comisiones', 'Liquidación de asesores y docentes', 'com'], ['Auditoría', 'Registro completo de acciones', 'audit']]; return ph('Centro de reportes', 'Genera y descarga informes en Excel (CSV) o PDF.') + `<div class="grid g3">${reps.map(([n, d, k]) => `<div class="card"><h4>${n}</h4><p class="small muted">${d}</p><div class="row"><button class="btn btn-secondary btn-sm" onclick="TBL._data['${k}']?exportCSV('${k}'):toast('Abre primero la vista de ${n} para preparar el reporte','info')">${I.excel} Excel</button><button class="btn btn-secondary btn-sm" onclick="window.print()">${I.download} PDF</button></div></div>`).join('')}</div>`; }

(async function boot() {
  if (CLOUD_ON) $('#app').innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--grad-hero)"><div style="text-align:center;color:#fff">${Logo('light', 30)}<div class="caption" style="color:rgba(255,255,255,.7);margin-top:14px">Conectando con la nube…</div></div></div>`;
  await initState();
  if ('serviceWorker' in navigator) { /* PWA: registrar sw.js si se despliega junto al index (opcional) */ }
