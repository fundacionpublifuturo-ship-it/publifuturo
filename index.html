function SuperView(r) { const sub = r.seg[1] || ''; const v = { '': SupHome, cursos: SupCourses, estudiantes: SupStudents, asistencia: SupAttendance, usuarios: SupUsers, config: SupConfig, auditoria: SupAudit, reportes: SupReports }[sub]; return v ? v(r) : NotFound(); }
function SupHome() { const inc = incomes(); const tot = sum(inc.filter(i => inPeriod(i.fecha)), 'valor'); const prev = sum(inc.filter(i => i.fecha && dayDiff(i.fecha) < -periodDays() && dayDiff(i.fecha) >= -2 * periodDays()), 'valor'); const exp = sum(S.expenses.filter(e => inPeriod(e.fecha)), 'valor'); const byM = last6.map(m => monthSum(inc, m.k)); const alerts = computeAlerts();
  return ph('Torre de control', `Vista consolidada de ${COPY.legal.nombre}.`, `<a class="btn btn-secondary btn-sm" href="#/superadmin/reportes">${I.download} Reportes</a>`) + `<div class="kpis">${stat('Ventas del periodo', fmt(tot), prev ? Math.round((tot - prev) / prev * 100) : 0, byM)}${stat('Utilidad del periodo', fmt(tot - exp))}${stat('Estudiantes activos', S.students.filter(s => ['Activo', 'En formación', 'Matriculado'].includes(s.estado)).length)}${stat('Cursos en curso', GROUPS.filter(g => g.estado === 'En curso').length)}${stat('Órdenes abiertas', S.serviceOrders.filter(o => o.estado !== 'Entregado').length)}${stat('Proyectos en desarrollo', S.microapps.filter(m => !['Entregado', 'Mantenimiento', 'Finalizado', 'Cancelado'].includes(m.estado)).length + S.videos.filter(v => v.etapa !== 'Entregado').length)}${stat('Cartera por cobrar', fmt(sum(receivables(), 'saldo')))}${stat('Alertas críticas', alerts.filter(a => a.prioridad === 'critico').length)}</div><div class="grid g2"><div class="card"><h4>Ingresos por mes</h4>${lineChart(last6.map(m => m.l), [{ n: 'Ingresos', v: byM }, { n: 'Egresos', v: last6.map(m => monthSum(S.expenses, m.k)), c: 'var(--danger)' }], { area: true })}</div><div class="card"><h4>Ventas por unidad</h4>${donut(UNITS.map(u => ({ n: u.n.split(' ').slice(0, 2).join(' '), v: unitSales(u.slug) })).filter(x => x.v > 0).sort((a, b) => b.v - a.v).slice(0, 7), { center: short(sum(UNITS, u => unitSales(u.slug))) })}</div><div class="card"><div class="card-hd"><h4>Cuánto deja cada curso</h4><a class="small" href="#/superadmin/cursos">Detalle</a></div>${COURSES.map(c => { const st = S.students.filter(s => s.cursoId === c.id); const ing = sum(st, 'precioFinal'); const cost = sum(st, () => c.costo) + Math.round(ing * (S.config.comAsesor + S.config.comDocente) / 100) + sum(S.expenses.filter(e => e.unidad === c.unidad), 'valor'); return `<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--border)"><div><b class="small">${c.nombre}</b><div class="caption">${st.length} matriculados</div></div><div style="text-align:right"><b class="num small" style="color:${ing - cost >= 0 ? 'var(--success)' : 'var(--danger)'}">${fmt(ing - cost)}</b><div class="caption">${ing ? Math.round((ing - cost) / ing * 100) : 0} % margen</div></div></div>`; }).join('')}</div><div class="card"><div class="card-hd"><h4>Alertas críticas y urgentes</h4><a class="small" href="#/admin/alertas">Centro de alertas</a></div>${alerts.filter(a => ['critico', 'urgente'].includes(a.prioridad)).slice(0, 7).map(a => `<div class="alert-it" style="padding:8px 0"><span class="pr pr-${a.prioridad}"></span><div><b class="small">${esc(a.tipo)}</b> <span class="caption">· ${unitName(a.unidad)}</span><div class="caption">${esc(a.mensaje)}</div></div></div>`).join('')}</div></div>`; }
function SupCourses() { const rows = COURSES.map(c => { const gs = GROUPS.filter(g => g.cursoId === c.id); const st = S.students.filter(s => s.cursoId === c.id); const ing = sum(st, 'precioFinal'); const cost = sum(st, () => c.costo) + Math.round(ing * (S.config.comAsesor + S.config.comDocente) / 100) + sum(S.expenses.filter(e => e.unidad === c.unidad), 'valor'); return { id: c.id, curso: c.nombre, grupos: gs.filter(g => !g.estado.startsWith('Fin')).length, matriculados: st.length, ocupacion: Math.round(100 * st.length / Math.max(1, sum(gs, 'cupo'))), ingreso: ing, recaudo: sum(st, 'pagado'), costo: cost, utilidad: ing - cost, margen: ing ? Math.round((ing - cost) / ing * 100) : 0, precio: c.precio }; }); return ph('Cursos activos y rentabilidad', 'Ingreso, costo y utilidad por programa, con grupos abiertos y ocupación.') + `<div class="kpis">${stat('Programas', COURSES.length)}${stat('Ingreso total', fmt(sum(rows, 'ingreso')))}${stat('Utilidad total', fmt(sum(rows, 'utilidad')))}${stat('Margen promedio', Math.round(sum(rows, 'margen') / rows.length) + ' %')}</div>` + table('sup_courses', rows, [{ k: 'curso', l: 'Curso' }, { k: 'precio', l: 'Precio', money: true, v: r => fmt(r.precio) }, { k: 'grupos', l: 'Grupos abiertos' }, { k: 'matriculados', l: 'Matriculados' }, { k: 'ocupacion', l: 'Ocupación', r: r => bar(r.ocupacion, r.ocupacion > 80 ? 'ok' : '') + `<span class="caption">${r.ocupacion} %</span>` }, { k: 'ingreso', l: 'Ingreso', money: true, v: r => fmt(r.ingreso) }, { k: 'recaudo', l: 'Recaudado', money: true, v: r => fmt(r.recaudo) }, { k: 'costo', l: 'Costo', money: true, v: r => fmt(r.costo) }, { k: 'utilidad', l: 'Utilidad', money: true, v: r => fmt(r.utilidad) }, { k: 'margen', l: 'Margen', r: r => badge(r.margen + ' %', r.margen >= 30 ? 'b-ok' : r.margen >= 10 ? 'b-warn' : 'b-bad') }], { size: 10 }) + `<div class="card" style="margin-top:20px"><h4>Grupos y cohortes</h4><div class="tbl-wrap"><table class="tbl cards"><thead><tr><th>Grupo</th><th>Inicio</th><th>Docente</th><th>Cupos</th><th>Estado</th></tr></thead><tbody>${GROUPS.map(g => { const n = groupStudents(g.id).length; return `<tr><td data-l="Grupo">${g.nombre}</td><td data-l="Inicio">${fdate(g.inicio)}</td><td data-l="Docente">${teacherOf(g.docenteId).nombre}</td><td data-l="Cupos">${n}/${g.cupo} ${bar(n / g.cupo * 100)}</td><td data-l="Estado">${sBadge(g.estado)}</td></tr>`; }).join('')}</tbody></table></div></div>`; }
function SupStudents(r) { if (r.q.q && !TBL.sup_students) { TBL.sup_students = { q: r.q.q, sort: null, dir: 1, page: 1, size: 12, f: {} }; } const rows = S.students.map(s => ({ ...s, curso: courseOf(s.cursoId).nombre, asistencia: attendancePct(s.id), avance: progressPct(s.id) })); return ph('Estudiantes', `${rows.length} estudiantes en todas las unidades académicas. Haz clic para abrir la ficha 360.`) + table('sup_students', rows, [{ k: 'nombre', l: 'Estudiante', clip: true }, { k: 'curso', l: 'Curso', clip: true }, { k: 'ciudad', l: 'Ciudad' }, { k: 'estado', l: 'Estado', r: s => sBadge(s.estado) }, { k: 'asistencia', l: 'Asistencia', v: s => s.asistencia === null ? '—' : s.asistencia + ' %' }, { k: 'avance', l: 'Avance', v: s => s.avance + ' %' }, { k: 'precioFinal', l: 'Valor', money: true, v: s => fmt(s.precioFinal) }, { k: 'saldo', l: 'Saldo', money: true, v: s => fmt(s.saldo) }, { k: 'fuente', l: 'Origen' }], { onRow: 'openStudent', filters: [{ k: 'curso', l: 'Curso' }, { k: 'estado', l: 'Estado' }, { k: 'departamento', l: 'Departamento' }], size: 12 }); }
function SupAttendance() { const gs = GROUPS.filter(g => S.attendance.some(a => a.grupoId === g.id)); const risk = S.students.filter(st => { const l = S.attendance.filter(a => a.estudianteId === st.id).sort((a, b) => a.sesionId.localeCompare(b.sesionId)).slice(-2); return l.length === 2 && l.every(x => x.estado === 'No asistió'); }); return ph('Asistencia global', 'Matriz grupo × clase con detección de riesgo de deserción.') + `<div class="kpis">${stat('Grupos con registros', gs.length)}${stat('Asistencia global', Math.round(100 * S.attendance.filter(a => a.estado !== 'No asistió').length / Math.max(1, S.attendance.length)) + ' %')}${stat('En riesgo de deserción', risk.length)}</div>${gs.map(g => { const ses = S.sessions.filter(x => x.grupoId === g.id && x.estado === 'Realizada'); const studs = groupStudents(g.id); return `<div class="card" style="margin-bottom:16px"><div class="card-hd"><h4>${g.nombre}</h4><span class="caption">${studs.length} estudiantes · ${ses.length} clases</span></div><div class="tbl-wrap"><table class="tbl" style="min-width:0"><thead><tr><th>Estudiante</th>${ses.map(x => `<th>C${x.n}</th>`).join('')}<th>%</th></tr></thead><tbody>${studs.map(st => { const p = attendancePct(st.id); return `<tr><td class="clip">${esc(st.nombre)}</td>${ses.map(x => { const a = S.attendance.find(y => y.estudianteId === st.id && y.sesionId === x.id); return `<td><i style="display:inline-block;width:14px;height:14px;border-radius:4px;background:${!a ? 'var(--border)' : a.estado === 'Asistió' ? 'var(--success)' : a.estado === 'No asistió' ? 'var(--danger)' : 'var(--warning)'}" title="${a?.estado || '—'}"></i></td>`; }).join('')}<td>${p === null ? '—' : badge(p + ' %', p >= S.config.asistenciaMin ? 'b-ok' : 'b-bad')}</td></tr>`; }).join('')}</tbody></table></div></div>`; }).join('')}${risk.length ? `<div class="card" style="border-color:var(--danger)"><h4>Riesgo de deserción</h4>${risk.map(st => `<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--border)"><span class="small"><b>${esc(st.nombre)}</b> · ${courseOf(st.cursoId).nombre}</span><a class="btn btn-wa btn-xs" href="${waLink(st.telefono, 'Hola ' + st.nombre.split(' ')[0] + ', te extrañamos en clase. ¿Cómo podemos ayudarte?')}" target="_blank" rel="noopener">${I.wa} Contactar</a></div>`).join('')}</div>` : ''}`; }
function SupUsers() { return ph('Usuarios y roles', 'Crea usuarios, asigna rol y unidades de negocio, activa o desactiva accesos.', `<button class="btn btn-primary btn-sm" onclick="newUser()">${I.plus} Nuevo usuario</button>`) + `<div class="card" style="padding:0">${S.users.map(u => `<div class="row between" style="padding:14px 18px;border-bottom:1px solid var(--border);gap:12px"><div class="row" style="gap:12px;min-width:0">${avatar(u.nombre, '', 'v')}<div style="min-width:0"><b class="small">${esc(u.nombre)}</b><div class="caption">${u.correo} · ${ROLE_LABEL[u.role]}</div>${u.units ? `<div class="caption">${u.units.length} de ${UNITS.length} unidades asignadas</div>` : ''}</div></div><div class="row" style="gap:6px">${u.role === 'admin' ? `<button class="btn btn-secondary btn-xs" onclick="editUnits('${u.id}')">Unidades</button>` : ''}<button class="btn btn-secondary btn-xs" onclick="toast('Enlace de restablecimiento enviado a ${u.correo}','ok')">Reiniciar acceso</button><button class="switch ${u.activo ? 'on' : ''}" onclick="const u=S.users.find(x=>x.id==='${u.id}');u.activo=!u.activo;audit('Usuario '+(u.activo?'activado':'desactivado'),'Usuario','${u.id}');save();render()" aria-label="Activo"></button></div></div>`).join('')}</div>`; }
function editUnits(id) { const u = S.users.find(x => x.id === id); modal(`<div class="stack" style="gap:8px">${UNITS.map(x => `<label class="check"><input type="checkbox" value="${x.slug}" ${u.units.includes(x.slug) ? 'checked' : ''}><span>${x.n}</span></label>`).join('')}</div>`, { title: 'Unidades asignadas · ' + u.nombre, footer: `<button class="btn btn-secondary" onclick="closeLayer()">Cancelar</button><button class="btn btn-primary" onclick="(function(){const u=S.users.find(x=>x.id==='${id}');u.units=$$('#layer input:checked').map(i=>i.value);audit('Unidades asignadas','Usuario','${id}','',u.units.length);save();closeLayer();render();toast('Permisos actualizados','ok')})()">Guardar</button>` }); }
function newUser() { modal(`<div class="stack"><div class="field"><label>Nombre</label><input class="input" id="nu_n"></div><div class="field"><label>Correo</label><input class="input" id="nu_c" inputmode="email"></div><div class="field"><label>Rol</label><select class="select" id="nu_r">${Object.entries(ROLE_LABEL).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select></div></div>`, { title: 'Nuevo usuario', footer: `<button class="btn btn-secondary" onclick="closeLayer()">Cancelar</button><button class="btn btn-primary" onclick="(function(){const n=$('#nu_n').value.trim(),c=$('#nu_c').value.trim();if(!n||!c.includes('@'))return toast('Nombre y correo válido son obligatorios.','err');const r=$('#nu_r').value;S.users.push({id:'U'+(S.users.length+1),role:r,nombre:n,sub:ROLE_LABEL[r],ref:'',correo:c,activo:true,units:r==='admin'?[]:undefined});audit('Usuario creado','Usuario',n);save();closeLayer();render();toast('Usuario creado','ok')})()">Crear</button>` }); }
function SupConfig() { const c = S.config; return ph('Configuración institucional', 'Parámetros que alimentan certificaciones, comisiones, alertas y plantillas.') + `<div class="grid g2"><div class="card"><h4>Parámetros</h4><div class="stack">${[['asistenciaMin', 'Asistencia mínima para certificar (%)'], ['comAsesor', 'Comisión asesor (%)'], ['comDocente', 'Comisión docente (%)'], ['cupo', 'Cupo por defecto'], ['anio', 'Año contable'], ['saldoMinimo', 'Saldo mínimo de seguridad (COP)']].map(([k, l]) => `<div class="field"><label>${l}</label><input class="input num" type="number" value="${c[k]}" onchange="const o=S.config['${k}'];S.config['${k}']=Number(this.value);audit('Configuración','${k}','',o,this.value);save();toast('Guardado','ok')"></div>`).join('')}</div></div><div class="card"><h4>Plantillas de WhatsApp</h4><p class="caption">Variables: {nombre} {valor} {fecha} {curso} {hora} {link} {servicio} {asesor} {interes} {equipo}</p><div class="stack">${Object.entries(c.plantillas).map(([k, v]) => `<div class="field"><label>${{ pago: 'Recordatorio de pago', clase: 'Aviso de clase', renov: 'Renovación de suscripción', lead: 'Seguimiento de lead', entrega: 'Entrega de equipo' }[k]}</label><textarea class="textarea" style="min-height:70px" onchange="S.config.plantillas['${k}']=this.value;audit('Plantilla','${k}');save();toast('Plantilla guardada','ok')">${esc(v)}</textarea></div>`).join('')}</div></div><div class="card"><h4>Datos de la fundación</h4><table class="mini-t"><tr><td class="muted">Nombre</td><td>${COPY.legal.nombre}</td></tr><tr><td class="muted">Naturaleza</td><td>${COPY.legal.tipo}</td></tr><tr><td class="muted">Domicilio</td><td>${COPY.legal.domicilio}</td></tr><tr><td class="muted">WhatsApp</td><td>${COPY.contacto.whatsapp}</td></tr><tr><td class="muted">Correo</td><td>${COPY.contacto.correo}</td></tr></table><p class="caption" style="margin-top:8px">Se editan en el código: sección [S06] → COPY.</p></div><div class="card"><h4>Sincronización entre dispositivos</h4>${CLOUD_ON ? `<div class="row" style="gap:8px;margin-bottom:10px">${SyncBadge()}</div><p class="small muted">Conectado a Supabase. Todos los dispositivos que abran este enlace comparten los mismos datos en tiempo real.</p><button class="btn btn-secondary btn-sm" onclick="navigator.clipboard.writeText(location.href.split('#')[0]).then(()=>toast('Enlace copiado','ok'))">${I.clip} Copiar enlace para compartir</button>` : `<p class="small muted">Ahora mismo los datos se guardan solo en este navegador. Para compartirlos entre dispositivos, crea un proyecto gratuito en Supabase y pega la URL y la llave "anon public" en el código (sección [S07], constantes <code>SUPABASE_URL</code> y <code>SUPABASE_ANON_KEY</code>).</p><a class="btn btn-secondary btn-sm" href="https://supabase.com" target="_blank" rel="noopener">Ir a supabase.com</a>`}</div><div class="card"><h4>Datos de demostración</h4><p class="small muted">Restablece todos los datos a la versión semilla. Se pierden los cambios hechos en esta sesión.</p><button class="btn btn-danger btn-sm" onclick="confirmDialog('Restablecer datos','Se borrará todo lo registrado en este navegador.',resetData,true)">Restablecer datos</button></div></div>`; }
function SupAudit() { return ph('Auditoría', `${S.audit.length} acciones registradas: usuario, acción, entidad, valor anterior y nuevo.`) + table('audit', S.audit.map((a, i) => ({ ...a, i })), [{ k: 'fecha', l: 'Fecha' }, { k: 'usuario', l: 'Usuario' }, { k: 'accion', l: 'Acción' }, { k: 'entidad', l: 'Entidad' }, { k: 'id', l: 'Referencia', clip: true }, { k: 'antes', l: 'Antes', clip: true }, { k: 'despues', l: 'Después', clip: true }], { filters: [{ k: 'usuario', l: 'Usuario' }, { k: 'entidad', l: 'Entidad' }], size: 15, idKey: 'i' }); }
function SupReports() { const reps = [['Comercial', 'Leads, embudo, ventas por unidad y asesor', 'leads'], ['Académico', 'Estudiantes, asistencia, avance y certificación', 'sup_students'], ['Financiero', 'Ingresos, egresos, cartera y P&L', 'tx'], ['Cartera', 'Saldos por deudor con aging y riesgo', 'recv'], ['Comisiones', 'Liquidación de asesores y docentes', 'com'], ['Auditoría', 'Registro completo de acciones', 'audit']]; return ph('Centro de reportes', 'Genera y descarga informes en Excel (CSV) o PDF.') + `<div class="grid g3">${reps.map(([n, d, k]) => `<div class="card"><h4>${n}</h4><p class="small muted">${d}</p><div class="row"><button class="btn btn-secondary btn-sm" onclick="TBL._data['${k}']?exportCSV('${k}'):toast('Abre primero la vista de ${n} para preparar el reporte','info')">${I.excel} Excel</button><button class="btn btn-secondary btn-sm" onclick="window.print()">${I.download} PDF</button></div></div>`).join('')}</div>`; }

/* ============================================================================
   [S17] ARRANQUE
   ============================================================================ */
(async function boot() {
  if (CLOUD_ON) $('#app').innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--grad-hero)"><div style="text-align:center;color:#fff">${Logo('light', 30)}<div class="caption" style="color:rgba(255,255,255,.7);margin-top:14px">Conectando con la nube…</div></div></div>`;
  await initState();
  if ('serviceWorker' in navigator) { /* PWA: registrar sw.js si se despliega junto al index (opcional) */ }
  render();
})();
</script>
